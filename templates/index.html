<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DLBC IQA Tool — Dr. Lankapalli Bullayya College of Engineering</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --navy: #0f2a5c;
      --navy-mid: #1a3a6b;
      --navy-light: #1e4080;
      --navy-pale: #e8eef8;
      --navy-subtle: #f0f4fb;
      --gold: #c8962a;
      --gold-light: #f5d98a;
      --white: #ffffff;
      --gray-50: #f8f9fc;
      --gray-100: #f0f2f7;
      --gray-200: #e2e6f0;
      --gray-300: #c8cfe0;
      --gray-400: #9aa3bb;
      --gray-500: #6b7494;
      --gray-700: #3d4463;
      --gray-900: #1a1f36;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --orange: #d97706;
      --orange-bg: #fef3c7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 1px 3px rgba(15, 42, 92, 0.08), 0 4px 16px rgba(15, 42, 92, 0.06);
      --shadow-lg: 0 8px 32px rgba(15, 42, 92, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }

    button {
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      font-family: 'DM Sans', sans-serif;
    }

    /* ─── AUTH ─── */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a1f44 0%, #1a3a6b 50%, #0f2a5c 100%);
      padding: 1rem;
    }

    .auth-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-logo-circle {
      width: 64px;
      height: 64px;
      background: var(--navy);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.75rem;
    }

    .auth-logo-circle span {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
    }

    .auth-logo h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy);
    }

    .auth-logo p {
      font-size: .8rem;
      color: var(--gray-500);
      margin-top: 3px;
    }

    .auth-form-group {
      margin-bottom: 1rem;
    }

    .auth-form-group label {
      display: block;
      font-size: .8rem;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: .35rem;
    }

    .auth-input {
      width: 100%;
      padding: .65rem .9rem;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: .9rem;
      transition: border .2s;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--navy-mid);
    }

    .auth-btn {
      width: 100%;
      padding: .75rem;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: .95rem;
      font-weight: 600;
      margin-top: .5rem;
      transition: background .2s;
    }

    .auth-btn:hover {
      background: var(--navy-light);
    }

    .auth-error {
      background: #fee2e2;
      color: #991b1b;
      padding: .6rem .9rem;
      border-radius: var(--radius-sm);
      font-size: .82rem;
      margin-bottom: .75rem;
    }

    /* ─── LAYOUT ─── */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      transition: transform .3s ease;
    }

    .sidebar-logo {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .sidebar-logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-logo-circle {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, .15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-logo-circle span {
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
    }

    .sidebar-logo-text h3 {
      color: #fff;
      font-size: .8rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .sidebar-logo-text p {
      color: rgba(255, 255, 255, .55);
      font-size: .65rem;
      margin-top: 1px;
    }

    .sidebar-user {
      padding: .9rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .sidebar-user-name {
      color: #fff;
      font-size: .82rem;
      font-weight: 600;
    }

    .sidebar-user-role {
      color: rgba(255, 255, 255, .55);
      font-size: .72rem;
      margin-top: 2px;
    }

    .sidebar-user-dept {
      color: var(--gold-light);
      font-size: .7rem;
      margin-top: 2px;
      word-wrap: break-word;
      line-height: 1.3;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: .75rem 0;
    }

    .nav-section-label {
      padding: .4rem 1.25rem .2rem;
      font-size: .65rem;
      font-weight: 600;
      color: rgba(255, 255, 255, .35);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: .55rem 1.25rem;
      color: rgba(255, 255, 255, .7);
      font-size: .82rem;
      cursor: pointer;
      transition: all .15s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, .12);
      color: #fff;
      border-left-color: var(--gold);
    }

    .nav-item-icon {
      font-size: 1rem;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: .9rem 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, .1);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .logout-btn {
      width: 100%;
      padding: .5rem;
      background: rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .7);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: var(--radius-sm);
      font-size: .8rem;
      transition: all .15s;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, .15);
      color: #fff;
    }

    .pwd-btn {
      width: 100%;
      padding: .5rem;
      background: transparent;
      color: var(--gold-light);
      border: none;
      border-radius: var(--radius-sm);
      font-size: .75rem;
      transition: all .15s;
    }

    .pwd-btn:hover {
      background: rgba(255, 255, 255, .05);
    }

    /* Mobile Toggle & Overlay */
    .mobile-toggle {
      display: none;
      background: var(--navy-subtle);
      border: 1px solid var(--gray-200);
      font-size: 1.4rem;
      color: var(--navy);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      border-radius: var(--radius-sm);
      line-height: 1;
      transition: background 0.2s;
    }
    
    .mobile-toggle:hover {
      background: var(--gray-200);
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 44, 0.5);
      z-index: 90;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .sidebar-overlay.open {
      display: block;
      opacity: 1;
    }

    .main {
      margin-left: 240px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
      padding: .75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--navy);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .page-content {
      padding: 1.5rem;
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* ─── NOTIFICATIONS ─── */
    .notif-btn {
      position: relative;
      background: none;
      border: none;
      font-size: 1.1rem;
      color: var(--gray-500);
      padding: .2rem;
    }

    .notif-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 16px;
      height: 16px;
      background: var(--red);
      border-radius: 50%;
      font-size: .55rem;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .notif-item {
      display: flex;
      gap: .75rem;
      padding: .75rem 0;
      border-bottom: 1px solid var(--gray-100);
      transition: opacity 0.2s;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: .3rem;
    }

    .notif-dot.critical {
      background: var(--red);
    }

    .notif-dot.warning {
      background: var(--orange);
    }

    .notif-dot.info {
      background: var(--navy-mid);
    }

    .notif-text {
      font-size: .8rem;
      color: var(--gray-700);
      line-height: 1.4;
    }

    .notif-time {
      font-size: .7rem;
      color: var(--gray-400);
      margin-top: 2px;
    }

    /* ─── COMPONENTS ─── */
    .card {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
    }

    .card-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title {
      font-size: .9rem;
      font-weight: 600;
      color: var(--navy);
    }

    .card-body {
      padding: 1.25rem;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .kpi-card {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      padding: 1.1rem 1.25rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .kpi-card.blue::before {
      background: var(--navy-mid);
    }

    .kpi-card.gold::before {
      background: var(--gold);
    }

    .kpi-card.green::before {
      background: var(--green);
    }

    .kpi-card.red::before {
      background: var(--red);
    }

    .kpi-label {
      font-size: .75rem;
      font-weight: 500;
      color: var(--gray-500);
      margin-bottom: .3rem;
    }

    .kpi-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--navy);
      font-family: 'DM Mono', monospace;
    }

    .kpi-sub {
      font-size: .72rem;
      color: var(--gray-400);
      margin-top: .2rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
    }

    .badge.good {
      background: var(--green-bg);
      color: var(--green);
    }

    .badge.risk {
      background: var(--orange-bg);
      color: var(--orange);
    }

    .badge.critical {
      background: var(--red-bg);
      color: var(--red);
    }

    .badge.pending {
      background: #f0f4fb;
      color: var(--navy-mid);
    }

    .badge.approved {
      background: #dcfce7;
      color: #15803d;
    }

    .badge.rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge.info {
      background: var(--navy-subtle);
      color: var(--navy-mid);
    }

    .badge.gold {
      background: var(--gold-light);
      color: var(--navy-mid);
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: .5rem;
    }

    .heatmap-cell {
      border-radius: var(--radius-sm);
      padding: .6rem .5rem;
      text-align: center;
    }

    .heatmap-cell .dept-name {
      font-size: .65rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: .2rem;
    }

    .heatmap-cell .dept-pct {
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'DM Mono', monospace;
    }

    .heatmap-cell.good {
      background: #dcfce7;
    }

    .heatmap-cell.good .dept-pct {
      color: #15803d;
    }

    .heatmap-cell.risk {
      background: #fef3c7;
    }

    .heatmap-cell.risk .dept-pct {
      color: #d97706;
    }

    .heatmap-cell.critical {
      background: #fee2e2;
    }

    .heatmap-cell.critical .dept-pct {
      color: #dc2626;
    }

    .prog-wrap {
      background: var(--gray-200);
      border-radius: 4px;
      overflow: hidden;
      width: 100%;
      height: 6px;
    }
    
    .prog-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease-in-out;
    }
    
    .prog-fill.good { background: var(--green); }
    .prog-fill.risk { background: var(--orange); }
    .prog-fill.critical { background: var(--red); }
    .prog-fill.navy { background: var(--navy-mid); }

    /* ─── MODALS, FORMS, & UTILITIES ─── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(10, 20, 44, 0.6); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 1rem;
      opacity: 0; transition: opacity 0.2s;
    }
    .modal-overlay.open { display: flex; opacity: 1; }
    .modal {
      background: #fff; border-radius: 12px; width: 100%; max-width: 550px; max-height: 90vh;
      display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
      transform: translateY(20px); transition: transform 0.2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--navy); }
    .modal-close { background: none; border: none; font-size: 1.2rem; color: var(--gray-500); cursor: pointer; transition: color 0.2s; padding: 0.2rem;}
    .modal-close:hover { color: var(--red); }
    .modal-body { padding: 1.5rem; overflow-y: auto; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 0.75rem; background: var(--gray-50); border-radius: 0 0 12px 12px; }

    .form-group { margin-bottom: 1rem; width: 100%; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--gray-700); margin-bottom: 0.4rem; }
    .form-control { width: 100%; padding: 0.65rem 0.85rem; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 0.9rem; transition: border 0.2s; background: #fff; font-family: inherit; }
    .form-control:focus { outline: none; border-color: var(--navy-mid); }
    .form-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; width: 100%; }
    .form-row.cols-2 > .form-group { flex: 1; min-width: 200px; margin-bottom: 0; }
    .form-row.cols-3 > .form-group { flex: 1; min-width: 150px; margin-bottom: 0; }
    .form-row.cols-4 > .form-group { flex: 1; min-width: 120px; margin-bottom: 0; }

    .btn { padding: 0.6rem 1.1rem; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; font-family: inherit; }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.75rem; }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-secondary { background: var(--gray-50); color: var(--gray-700); border: 1px solid var(--gray-200); }
    .btn-secondary:hover { background: var(--gray-200); }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fecaca; }
    .btn-success { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .btn-success:hover { background: #bbf7d0; }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-gold:hover { background: #b48523; }

    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--navy-mid); color: #fff; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: var(--shadow-lg); font-size: 0.9rem; font-weight: 500; transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 2000; }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* TABS & REPORT FORM ELEMENTS */
    .tab-nav { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 2px solid var(--gray-200); padding-bottom: 0.5rem; overflow-x: auto; }
    .tab-btn { background: none; border: none; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; color: var(--gray-500); cursor: pointer; border-radius: var(--radius-sm); transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { background: var(--gray-100); color: var(--navy); }
    .tab-btn.active { background: var(--navy); color: #fff; }
    
    .sec-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .sec-title { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .sec-num { width: 28px; height: 28px; background: var(--navy); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; font-family: 'DM Mono', monospace; flex-shrink: 0; }
    .sec-title-text { font-size: 1.05rem; font-weight: 600; color: var(--navy); }
    .sec-sub { font-size: 0.8rem; color: var(--gray-500); margin-bottom: 1rem; }
    .field-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    .field { flex: 1; min-width: 180px; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--gray-600); margin-bottom: 0.3rem; }
    .field input, .field select, .field textarea { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--gray-300); border-radius: 4px; font-size: 0.85rem; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--navy-mid); }
    .repeatable { padding: 1rem; border: 1px dashed var(--gray-300); border-radius: var(--radius-sm); margin-bottom: 1rem; position: relative; background: var(--gray-50); }
    .remove-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: #fee2e2; color: #dc2626; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer; font-weight: 600;}
    .add-row-btn { background: none; border: 1px dashed var(--navy-mid); color: var(--navy-mid); padding: 0.6rem 1rem; width: 100%; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .add-row-btn:hover { background: var(--navy-subtle); }

    /* Mobile Toggle Enhancement */
    .mobile-toggle {
      display: none;
      background: var(--navy-subtle);
      border: 1px solid var(--gray-200);
      font-size: 1.4rem;
      color: var(--navy);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      border-radius: var(--radius-sm);
      line-height: 1;
      transition: background 0.2s;
    }
    
    .mobile-toggle:hover {
      background: var(--gray-200);
    }

    /* Mobile Responsiveness */
    @media(max-width:900px) {
      .mobile-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar {
        transform: translateX(-100%);
        box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        width: 100%;
        overflow-x: hidden;
      }

      .topbar {
        padding: 0.75rem 1rem;
      }

      .topbar-title {
        font-size: 0.95rem;
      }

      .page-content {
        padding: 1rem;
      }

      .grid-2,
      .kpi-grid,
      .field-row.cols-2,
      .field-row.cols-3,
      .field-row.cols-4 {
        grid-template-columns: 1fr !important;
      }

      .hide-on-mobile {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <div id="auth-screen" class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-circle"><span>LB<br>CoE</span></div>
        <h2>Dr. Lankapalli Bullayya<br>College of Engineering</h2>
        <p>Internal Quality Assurance Cell — IQA Tool</p>
      </div>
      <div id="auth-error" class="auth-error" style="display:none;"></div>
      <div id="login-step">
        <div class="auth-form-group">
          <label>Employee ID / Email</label>
          <input class="auth-input" id="auth-id" placeholder="e.g. narasimha@dlbce.ac.in" />
        </div>
        <div class="auth-form-group">
          <label>Password</label>
          <input class="auth-input" type="password" id="auth-pass" placeholder="Enter password" />
        </div>
        <button class="auth-btn" onclick="doLogin()">Log In</button>
      </div>
    </div>
  </div>

  <div id="app-shell" class="app-shell" style="display:none;">

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-row">
          <div class="sidebar-logo-circle"><span>LB<br>CoE</span></div>
          <div class="sidebar-logo-text">
            <h3>DLBC IQA Tool</h3>
            <p>Quality Assurance Platform</p>
          </div>
        </div>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-name" id="sb-user-name">Loading...</div>
        <div class="sidebar-user-role" id="sb-user-role">—</div>
        <div class="sidebar-user-dept" id="sb-user-dept"></div>
      </div>
      <div class="sidebar-nav" id="sidebar-nav"></div>
      <div class="sidebar-footer">
        <button class="pwd-btn" onclick="openChangePassword()">🔑 Change Password</button>
        <button class="logout-btn" onclick="doLogout()">⎋ Logout</button>
      </div>
    </nav>

    <div class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
          <span class="topbar-title" id="page-title">Dashboard</span>
        </div>
        <div class="topbar-right">
          <span class="hide-on-mobile" style="font-size:.78rem;color:var(--gray-400);margin-right:.5rem;"
            id="topbar-date"></span>
          <button class="notif-btn" onclick="showPage('notifications')">🔔<span class="notif-badge" id="notif-badge"
              style="display:none;">0</span></button>
        </div>
      </div>
      <div class="page-content" id="page-content"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Modal</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ════════════════════════════════════════════
    // CONFIG & DATA STORE
    // ════════════════════════════════════════════
    const API_URL = '/api';
    let currentUser = null;

    // Local fallback data
    let submissions = [
      { id: 'SUB001', dept: 'CSE', month: 'February', year: '2025-26', status: 'Approved', created_at: new Date().toISOString(), sections: 18, complete_pct: 82 },
      { id: 'SUB002', dept: 'Anti Ragging and Discipline Committee', month: 'February', year: '2025-26', status: 'Pending', created_at: new Date().toISOString(), sections: 4, complete_pct: 100 }
    ];
    let calendarEvents = [
      { id: 1, date: 'Mar 15', event: 'Report Submission Deadline', type: 'Deadline' },
      { id: 2, date: 'Mar 22', event: 'Committee Review Meeting', type: 'Committee' }
    ];
    let calendarDocs = [];
    let customSections = [];
    let notifications = [
      { id: 1, text: "Welcome to the DLBC IQA Tool. The system is ready for the new academic year.", time: new Date().toISOString(), type: 'info', read: false }
    ];

    let departmentsData = {
      'CSE': { faculty: 19, y1: 120, y2: 120, y3: 120, y4: 120, placed: 0 },
      'Civil': { faculty: 10, y1: 60, y2: 60, y3: 60, y4: 60, placed: 0 },
      'ECE': { faculty: 18, y1: 120, y2: 120, y3: 120, y4: 120, placed: 0 },
      'EEE': { faculty: 10, y1: 60, y2: 60, y3: 60, y4: 60, placed: 0 },
      'BHS': { faculty: 10, cse: 120, ece: 120, eee: 60, civil: 60, placed: 0 }
    };

    const DEPARTMENTS = ['CSE', 'Civil', 'ECE', 'EEE', 'BHS'];
    const DEPT_FULL = {
      CSE: 'Computer Science Engineering',
      Civil: 'Civil Engineering',
      ECE: 'Electronics & Communication Engineering',
      EEE: 'Electrical & Electronics Engineering',
      BHS: 'Basic & Humanities Sciences'
    };

    const COMMITTEES = [
      'Anti Ragging and Discipline Committee', 'Internal Complaint Committee (ICC)', 'Student Grievances and Redressal Committee',
      'SC/ST Committee', 'OBC Committee', 'Minorities Committee', 'R&D',
      'Entrepreneurship, Startup and Innovation', 'Literary and Cultural Committee',
      'Sports', 'SDC / Internship / Placement / III Cell / Career Guidance', 'Alumni / NSS',
      'Maintenance Committee', 'Sustainable Development Goals (SDG)', 'Information Technology & Website', 'Canteen and Food Committee', 'Professional Bodies',
      'Equity Committee', 'IQAC'
    ];

    let USERS = []; // Fetched dynamically from the backend

    let SECTIONS = {
      1: 'Workshops Organised', 2: 'Workshops Attended', 3: 'Conferences Organised',
      4: 'Conference Papers Presented', 5: 'Guest Lectures Organised', 6: 'Resource Person Activity',
      7: 'Publications (Journal Papers)', 8: 'Book Chapters / Books Published',
      9: 'Student-centric T&L Methodologies', 10: 'e-Learning Practices',
      11: 'Funded Projects', 12: 'Patents Published / Granted',
      13: 'Faculty Awards / Achievements', 14: 'Student Achievements',
      15: 'Student Placement', 16: 'Higher Studies', 17: 'Infrastructure',
      18: 'Man Power', 19: 'Student Support Systems', 20: 'Capacity Building',
      21: 'Professional Body Activities', 22: 'Any Other Information'
    };

    const COMMITTEE_SECTIONS = {
      101: 'Meeting Circular & Details',
      102: 'Minutes of Meeting (MoM)',
      103: 'Action Plan',
      104: 'Action Taken Report'
    };

    function getCurrentSectionsMap() {
      const deptEl = document.getElementById('rep-dept');
      const dept = deptEl ? deptEl.value : (currentUser.dept ? currentUser.dept.split(',')[0].trim() : '');
      const isStandard = !dept || DEPARTMENTS.includes(dept) || dept === 'R&D' || dept === 'SDC / Internship / Placement / III Cell / Career Guidance';

      if (isStandard) {
        const currentSecs = { ...SECTIONS };
        customSections.forEach(cs => { currentSecs[cs.sec_num] = cs.title; });
        return currentSecs;
      } else {
        return COMMITTEE_SECTIONS;
      }
    }

    function getAllPossibleSectionsMap() {
      const allSecs = { ...SECTIONS, ...COMMITTEE_SECTIONS };
      customSections.forEach(cs => { allSecs[cs.sec_num] = cs.title; });
      return allSecs;
    }

    // ════════════════════════════════════════════
    // UTILITIES (TIMEZONE FIXES & LIVE CLOCK)
    // ════════════════════════════════════════════
    function formatDBDate(dateString) {
      if (!dateString) return '';
      let d = new Date(dateString);
      // PostgreSQL timestamps often come back without 'Z' but represent UTC on Render.
      if (typeof dateString === 'string' && dateString.includes('T') && !dateString.includes('Z') && !dateString.includes('+')) {
        d = new Date(dateString + 'Z');
      }
      if (isNaN(d.getTime())) return dateString;
      return d.toLocaleString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
      });
    }

    function updateClock() {
      const el = document.getElementById('topbar-date');
      if (el) {
        const now = new Date();
        el.textContent = now.toLocaleString('en-IN', {
          weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        });
      }
    }
    // Start the clock right away
    setInterval(updateClock, 1000);

    // ════════════════════════════════════════════
    // AUTH & API FETCHING
    // ════════════════════════════════════════════
    async function doLogin() {
      const id = document.getElementById('auth-id').value.trim();
      const pass = document.getElementById('auth-pass').value;
      if (!id || !pass) { showAuthError('Please enter both ID and Password.'); return; }

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, pass })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            currentUser = data.user;

            // Strip whitespace and standardize role casing from the database to prevent blank sidebars
            if (currentUser && currentUser.role) {
              const r = currentUser.role.trim().toLowerCase();
              if (r === 'super admin') currentUser.role = 'Super Admin';
              else if (r === 'admin') currentUser.role = 'Admin';
              else if (r === 'principal') currentUser.role = 'Principal';
              else if (r === 'hod') currentUser.role = 'HOD';
              else if (r === 'committee head') currentUser.role = 'Committee Head';
              else currentUser.role = currentUser.role.trim();
            }

            hideAuthError();
            launchApp();
            return;
          } else {
            showAuthError(data.message || 'Invalid credentials.');
            return;
          }
        }
      } catch (e) {
        console.warn("Backend unavailable, falling back to local simulation.");
      }

      const user = USERS.find(u => u.id === id && u.pass === pass);
      if (user) {
        currentUser = user;

        // Apply the same standardization locally
        if (currentUser && currentUser.role) {
          const r = currentUser.role.trim().toLowerCase();
          if (r === 'super admin') currentUser.role = 'Super Admin';
          else if (r === 'admin') currentUser.role = 'Admin';
          else if (r === 'principal') currentUser.role = 'Principal';
          else if (r === 'hod') currentUser.role = 'HOD';
          else if (r === 'committee head') currentUser.role = 'Committee Head';
          else currentUser.role = currentUser.role.trim();
        }

        hideAuthError(); launchApp();
      }
      else { showAuthError("Invalid credentials."); }
    }

    function showAuthError(msg) { const e = document.getElementById('auth-error'); e.textContent = msg; e.style.display = 'block'; }
    function hideAuthError() { document.getElementById('auth-error').style.display = 'none'; }

    function doLogout() {
      currentUser = null;
      document.getElementById('app-shell').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('auth-pass').value = '';
    }

    function openChangePassword() {
      openModal('Change Password', `
        <div class="form-group"><label class="form-label">New Password</label><input type="password" class="form-control" id="new-pwd" placeholder="Enter new password"></div>
        <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" class="form-control" id="confirm-pwd" placeholder="Confirm new password"></div>
    `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitChangePassword()">Update Password</button>`);
    }

    async function submitChangePassword() {
      const newPass = document.getElementById('new-pwd').value;
      const confirmPass = document.getElementById('confirm-pwd').value;
      if (newPass !== confirmPass) { showToast("Passwords do not match."); return; }
      if (newPass.length < 6) { showToast("Password too short."); return; }

      try {
        const res = await fetch(`${API_URL}/users/${currentUser.id}/password`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ newPass })
        });
        if (res.ok) { showToast("Password updated successfully."); closeModal(); return; }
      } catch (e) { }

      const idx = USERS.findIndex(u => u.id === currentUser.id);
      if (idx > -1) { USERS[idx].pass = newPass; }
      showToast("Password updated locally.");
      closeModal();
    }

    async function fetchCoreData() {
      try {
        let res = await fetch(`${API_URL}/submissions?role=${currentUser.role}&dept=${currentUser.dept}`);
        if (res.ok) submissions = await res.json();

        res = await fetch(`${API_URL}/calendar`);
        if (res.ok) calendarEvents = await res.json();

        res = await fetch(`${API_URL}/calendar-docs`);
        if (res.ok) calendarDocs = await res.json();

        res = await fetch(`${API_URL}/notifications`);
        if (res.ok) notifications = await res.json();

        res = await fetch(`${API_URL}/sections`);
        if (res.ok) {
          customSections = await res.json();
          customSections.forEach(s => { SECTIONS[s.sec_num] = s.title; });
        }

        res = await fetch(`${API_URL}/departments-data`);
        if (res.ok) {
          const dbData = await res.json();
          dbData.forEach(row => {
            if (departmentsData[row.dept]) {
              departmentsData[row.dept] = { ...departmentsData[row.dept], ...row };
            }
          });
        }

        if (currentUser.role === 'Super Admin' || currentUser.role === 'Admin') {
          res = await fetch(`${API_URL}/users`);
          if (res.ok) USERS = await res.json();
        }
      } catch (e) { console.warn("Using local data cache."); }
    }


    // ════════════════════════════════════════════
    // APP LAUNCH & SIDEBAR NAVIGATION
    // ════════════════════════════════════════════
    async function launchApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-shell').style.display = 'flex';
      document.getElementById('sb-user-name').textContent = currentUser.name;
      document.getElementById('sb-user-role').textContent = currentUser.role;

      let deptText = currentUser.dept ? (DEPT_FULL[currentUser.dept] || currentUser.dept) : 'Institution Level';
      if (currentUser.dept && currentUser.dept.includes(',')) deptText = 'Multiple Committees Assigned';
      document.getElementById('sb-user-dept').textContent = deptText;

      // Initialize the clock immediately on login
      updateClock();

      await fetchCoreData();
      updateNotifBadge();
      buildSidebar();
      showPage('dashboard');
    }

    // Toggle Sidebar Function for Mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar) sidebar.classList.toggle('open');
      if (overlay) overlay.classList.toggle('open');
    }

    function buildSidebar() {
      const role = currentUser.role;
      let items = [];

      if (role === 'Super Admin' || role === 'Admin') {
        items = [
          { section: 'Overview', links: [{ icon: '📊', label: 'Dashboard', page: 'dashboard' }, { icon: '🔔', label: 'Notifications', page: 'notifications' }] },
          { section: 'Data Management', links: [{ icon: '📋', label: 'Submissions', page: 'submissions' }, { icon: '✅', label: 'Approvals Queue', page: 'approvals' }] },
          { section: 'Quality Tracking', links: [{ icon: '📈', label: 'Department Reports', page: 'dept-reports' }, { icon: '📂', label: 'Departments Data', page: 'dept-data' }, { icon: '👥', label: 'Committee Reports', page: 'comm-reports' }, { icon: '📅', label: 'Academic Calendar', page: 'calendar' }] },
          { section: 'System', links: [{ icon: '📄', label: 'Reports & Export', page: 'reports' }, { icon: '👥', label: 'User Management', page: 'users' }, { icon: '⚙️', label: 'Manage Sections', page: 'sections' }] },
          { section: 'Help & Support', links: [{ icon: '❓', label: 'User Guide', page: 'guide' }, { icon: '✉️', label: 'Contact IT', page: 'contact' }] }
        ];
        if (currentUser.dept) { items[1].links.unshift({ icon: '📝', label: 'Submit Report', page: 'submit' }); }
      } else if (role === 'Principal') {
        items = [
          { section: 'Overview', links: [{ icon: '📊', label: 'Dashboard', page: 'dashboard' }, { icon: '🔔', label: 'Notifications', page: 'notifications' }] },
          { section: 'Reports', links: [{ icon: '📈', label: 'Institution Summary', page: 'dept-reports' }, { icon: '👥', label: 'Committee Reports', page: 'comm-reports' }, { icon: '📄', label: 'Reports & Export', page: 'reports' }] },
          { section: 'Resources', links: [{ icon: '📅', label: 'Academic Calendar', page: 'calendar' }] },
          { section: 'Help & Support', links: [{ icon: '❓', label: 'User Guide', page: 'guide' }, { icon: '✉️', label: 'Contact IT', page: 'contact' }] }
        ];
      } else {
        // Bulletproof fallback for all other roles (HOD, Committee Head, etc.)
        items = [
          { section: 'Overview', links: [{ icon: '📊', label: 'Dashboard', page: 'dashboard' }, { icon: '🔔', label: 'Notifications', page: 'notifications' }] },
          { section: 'My Department', links: [{ icon: '📝', label: 'Submit Report', page: 'submit' }, { icon: '📋', label: 'My Submissions', page: 'submissions' }] },
          { section: 'Resources', links: [{ icon: '📅', label: 'Academic Calendar', page: 'calendar' }] },
          { section: 'Help & Support', links: [{ icon: '❓', label: 'User Guide', page: 'guide' }, { icon: '✉️', label: 'Contact IT', page: 'contact' }] }
        ];
      }

      let html = '';
      items.forEach(sec => {
        html += `<div class="nav-section-label">${sec.section}</div>`;
        sec.links.forEach(l => {
          html += `<div class="nav-item" onclick="showPage('${l.page}')" data-page="${l.page}"><span class="nav-item-icon">${l.icon}</span>${l.label}</div>`;
        });
      });
      document.getElementById('sidebar-nav').innerHTML = html;
    }

    function showPage(page) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));

      const titles = {
        dashboard: 'Dashboard', submissions: 'Submissions', approvals: 'Pending Approvals',
        'dept-reports': 'Department Quality Reports', 'dept-data': 'Departments Data', 'comm-reports': 'Committee Quality Reports',
        calendar: 'Academic Calendar', notifications: 'Notifications & Alerts',
        reports: 'Reports & Export', users: 'User Management', submit: 'Submit Monthly Report',
        sections: 'Manage Form Sections', guide: 'User Guide & Documentation', contact: 'Contact IT Support'
      };

      document.getElementById('page-title').textContent = titles[page] || page;
      const c = document.getElementById('page-content');

      switch (page) {
        case 'dashboard': c.innerHTML = buildDashboard(); break;
        case 'submissions': c.innerHTML = buildSubmissions(); break;
        case 'approvals': c.innerHTML = buildApprovals(); break;
        case 'dept-reports': c.innerHTML = buildDeptReports(); break;
        case 'dept-data': c.innerHTML = buildDeptData(); break;
        case 'comm-reports': c.innerHTML = buildCommReports(); break;
        case 'calendar': c.innerHTML = buildCalendar(); break;
        case 'reports': c.innerHTML = buildReports(); break;
        case 'users': c.innerHTML = buildUsers(); break;
        case 'sections': c.innerHTML = buildSectionsMgmt(); break;
        case 'notifications': c.innerHTML = buildNotifications(); break;
        case 'submit': c.innerHTML = buildSubmitForm(); initRepeatables(); break;
        case 'guide': c.innerHTML = buildGuidePage(); break;
        case 'contact': c.innerHTML = buildContactPage(); break;
        default: c.innerHTML = `<p>Page not found.</p>`;
      }

      // Auto-close sidebar on mobile after clicking a link
      if (window.innerWidth <= 900) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (sidebar) sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('open');
      }
    }

    // ════════════════════════════════════════════
    // DEPARTMENTS DATA PAGE
    // ════════════════════════════════════════════
    function buildDeptData() {
      const options = DEPARTMENTS.map((d, i) => `<option value="${i}">${d}</option>`).join('');

      return `
  <div class="card" style="margin-bottom: 1.5rem; background: var(--navy); border: none; box-shadow: var(--shadow-lg);">
     <div class="card-body" style="display:flex; align-items:center; gap: 1rem; flex-wrap: wrap; padding: 1.5rem;">
        <div style="flex:1; min-width: 250px;">
            <label class="form-label" style="color: rgba(255,255,255,0.8); font-size: 0.85rem; margin-bottom: 8px;">Select Department to View Data</label>
            <div style="position:relative;">
              <select class="form-control" style="appearance:none; font-size:1rem; font-weight:600; padding:12px 16px; border-radius:8px; border:none; box-shadow:0 2px 8px rgba(0,0,0,0.1); cursor:pointer;" id="dept-data-select" onchange="switchDeptDataDropdown(this.value)">
                  ${options}
              </select>
              <div style="position:absolute; right:16px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:12px; color:var(--gray-500);">▼</div>
            </div>
        </div>
     </div>
  </div>
  <div id="dept-data-content">
     ${getDeptDataContent(DEPARTMENTS[0])}
  </div>`;
    }

    window.switchDeptDataDropdown = function (idx) {
      document.getElementById('dept-data-content').innerHTML = getDeptDataContent(DEPARTMENTS[idx]);
    }

    function getDeptDataContent(dept) {
      const data = departmentsData[dept] || {};
      const canEdit = currentUser.role === 'Super Admin' || currentUser.role === 'Admin' || (currentUser.role === 'HOD' && currentUser.dept.includes(dept));

      let total = 0;
      let breakdownHtml = '';
      let placedHtml = '';

      if (dept === 'BHS') {
        total = parseInt(data.cse || 0) + parseInt(data.ece || 0) + parseInt(data.eee || 0) + parseInt(data.civil || 0);
        breakdownHtml = `
        <div style="padding:8px 12px; border:1px dashed var(--gray-200); border-radius:6px; display:flex; justify-content:space-between; align-items:center; color:var(--gray-700);">
            <span style="font-weight:500;">CSE (1st Year)</span> <span style="font-weight:600; font-family:'DM Mono',monospace;">${data.cse || 0}</span>
        </div>
        <div style="padding:8px 12px; border:1px dashed var(--gray-200); border-radius:6px; display:flex; justify-content:space-between; align-items:center; color:var(--gray-700);">
            <span style="font-weight:500;">ECE (1st Year)</span> <span style="font-weight:600; font-family:'DM Mono',monospace;">${data.ece || 0}</span>
        </div>
        <div style="padding:8px 12px; border:1px dashed var(--gray-200); border-radius:6px; display:flex; justify-content:space-between; align-items:center; color:var(--gray-700);">
            <span style="font-weight:500;">EEE (1st Year)</span> <span style="font-weight:600; font-family:'DM Mono',monospace;">${data.eee || 0}</span>

        newData.y3 = parseInt(document.getElementById('ed-y3').value) || 0;

      departmentsData[dept] = newData;

        contentDiv.innerHTML = getDeptDataContent(dept);
      } else {
        showPage('dept-data');

      showToast(`${dept} data updated successfully.`);
    }

    function canUserViewNotif(n) {
      const isAdmin = (currentUser.role === 'Super Admin' || currentUser.role === 'Admin');
      if (isAdmin) return true;
      
      const t = n.target || 'All';
      if (t === 'All') return true;

      // Determine if user effectively acts as HOD or Committee Head based on their assigned departments string
      const userDepts = currentUser.dept ? currentUser.dept.split(',').map(d => d.trim()) : [];
      const actsAsHOD = currentUser.role === 'HOD' || userDepts.some(d => DEPARTMENTS.includes(d));
      const actsAsComm = currentUser.role === 'Committee Head' || userDepts.some(d => COMMITTEES.includes(d));

      if (t === 'HOD' && actsAsHOD) return true;
      if (t === 'Committee' && actsAsComm) return true;

      return false; // Hide if it doesn't match their role/responsibilities
    }

    // UPDATED submitAlert FUNCTION FOR DATABASE CONNECTION
    async function submitAlert() {
      const msg = document.getElementById('alert-msg').value.trim();
      if (!msg) return showToast("Message is required.");

      const payload = {
        text: msg,
        time: new Date().toISOString(),
        type: document.getElementById('alert-priority').value,
        target: document.getElementById('alert-target').value
      };

      try {
        // Send the notification to the database
        const res = await fetch(`${API_URL}/notifications`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          await fetchCoreData(); // This refreshes the list from the database
          closeModal();
          updateNotifBadge();
          showPage('notifications');
          showToast("Alert successfully broadcasted to all users.");
          return;
        }
      } catch (e) {
        console.error("Failed to send notification to DB", e);
      }

      // Fallback just in case the DB is temporarily offline
      notifications.unshift({ ...payload, id: Date.now(), read: false });
      closeModal();
      updateNotifBadge();
      showPage('notifications');
      showToast("Alert saved locally (Database unreachable).");
    }

    async function deleteNotification(id) {
      if (!confirm("Are you sure you want to delete this notification?")) return;
      try {
        const res = await fetch(`${API_URL}/notifications/${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (res.ok) { await fetchCoreData(); showPage('notifications'); updateNotifBadge(); showToast("Notification deleted."); return; }
        else { console.warn("Backend error: Endpoint might be missing. Falling back to local delete."); }
      } catch (e) { console.warn("Backend unavailable, using local delete."); }
      notifications = notifications.filter(n => String(n.id) !== String(id));
      showPage('notifications'); updateNotifBadge(); showToast("Notification deleted locally.");
    }

    // ════════════════════════════════════════════
    // SECTION PROGRESS WIDGET
    // ════════════════════════════════════════════
    function buildSectionProgressHTML(filteredSubs) {
      if (filteredSubs.length === 0) return '<p style="font-size:.8rem;color:var(--gray-400);">No submissions available to calculate progress.</p>';

      const allPossibleSecs = getAllPossibleSectionsMap();

      const presentKeys = new Set();
      filteredSubs.forEach(sub => {
        let data = sub.report_data || sub.reportData;
        if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = null; } }
        if (data) {
          Object.keys(data).forEach(k => presentKeys.add(k.replace('Section ', '')));
        }
      });

      if (presentKeys.size === 0) Object.keys(SECTIONS).forEach(k => presentKeys.add(k));

      let html = '';
      Array.from(presentKeys).sort((a, b) => a - b).forEach(sec => {
        let filledCount = 0;
        filteredSubs.forEach(sub => {
          let data = sub.report_data || sub.reportData;
          if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = null; } }
          if (data && data[`Section ${sec}`]) {
            filledCount++;
          } else if (!data) {
            let pct = sub.complete_pct || sub.completePct || 0;
            if (((parseInt(sec) * 13) % 100) < pct) filledCount++;
          }
        });
        let pct = Math.round((filledCount / filteredSubs.length) * 100);
        let colorClass = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--orange)' : 'var(--red)';
        let title = allPossibleSecs[sec] || `Section ${sec}`;

        html += `
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.8rem;">
            <div style="width:45%;max-width:260px;font-size:.8rem;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="S.${sec}: ${title}">S.${sec}: ${title}</div>
            <div style="flex:1;height:8px;background:var(--gray-100);border-radius:4px;overflow:hidden;">
                <div style="height:100%;width:${pct}%;background:${colorClass};border-radius:4px;transition:width 0.5s;"></div>
            </div>
            <div style="width:35px;text-align:right;font-size:.75rem;font-family:'DM Mono',monospace;color:var(--gray-500);">${pct}%</div>
        </div>`;
      });
      return html;
    }

    // ════════════════════════════════════════════
    // DASHBOARD
    // ════════════════════════════════════════════
    function statusClass(pct) { return pct >= 70 ? 'good' : pct >= 60 ? 'risk' : 'critical'; }
    function statusLabel(pct) { return pct >= 70 ? 'Good' : pct >= 60 ? 'At Risk' : 'Critical'; }

    function buildDashboard() {
      const role = currentUser.role;
      if (role === 'Super Admin' || role === 'Admin') return buildAdminDashboard();
      if (role === 'Principal') return buildPrincipalDashboard();
      return buildHODDashboard();
    }

    function buildAdminDashboard() {
      const deptData = DEPARTMENTS.map(d => {
        const deptSubs = submissions.filter(s => s.dept === d);
        const avg = deptSubs.length ? Math.round(deptSubs.reduce((a, b) => a + (b.complete_pct || b.completePct), 0) / deptSubs.length) : 0;
        return { dept: d, pct: avg };
      });
      const commData = COMMITTEES.map(c => {
        const commSubs = submissions.filter(s => s.dept === c);
        const avg = commSubs.length ? Math.round(commSubs.reduce((a, b) => a + (b.complete_pct || b.completePct), 0) / commSubs.length) : 0;
        return { dept: c, pct: avg };
      });
      const overall = deptData.length ? Math.round(deptData.reduce((a, d) => a + d.pct, 0) / deptData.length) : 0;
      let heatmapHTML = deptData.map(d => `
    <div class="heatmap-cell ${statusClass(d.pct)}">
      <div class="dept-name">${d.dept}</div>
      <div class="dept-pct">${d.pct}%</div>
    </div>`).join('');

      let commHTML = commData.map(c => `

    function viewSubmission(id) {
      const s = submissions.find(x => x.id === id);
      const pct = s.complete_pct || s.completePct;
      const allPossibleSecs = getAllPossibleSectionsMap();
      const reportData = (typeof s.reportData === 'string' ? JSON.parse(s.reportData) : (s.reportData || s.report_data || {}));

      openModal(`Submission: ${s.id}`,
        `<div style="margin-bottom:1rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;">
        <div><strong>${s.dept}</strong><br><span style="font-size:.78rem;color:var(--gray-400);">${s.month} ${s.year}</span></div>

          const num = key.replace('Section ', '');
          const title = allPossibleSecs[num] || key;
          return `<div style="padding:.4rem .6rem;background:var(--gray-100);border-radius:4px;font-size:.75rem;">S.${num}: ${title}</div>`;
        }).join('')}

     <button class="btn btn-gold" onclick="downloadSubmissionPDF('${s.id}')">⬇ Download Full PDF</button>`
      );

    function approveSubmission(id) { const s = submissions.find(x => x.id === id); if (s) s.status = 'Approved'; showPage('approvals'); }
    function rejectSubmission(id) { const s = submissions.find(x => x.id === id); if (s) s.status = 'Rejected'; showPage('approvals'); }

    // ════════════════════════════════════════════
    // INDIVIDUAL PDF GENERATION
    // ════════════════════════════════════════════
    function downloadSubmissionPDF(id) {
      const s = submissions.find(x => x.id === id);
      if (!s) return showToast("Submission not found.");

      showToast("Generating Full Report for " + s.dept + "...");

      setTimeout(() => {
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();

          doc.setFontSize(16); doc.setTextColor(15, 42, 92);
          doc.text("Dr. Lankapalli Bullayya College of Engineering", 105, 20, { align: "center" });
          doc.setFontSize(12);
          doc.text("IQAC Monthly Department Report", 105, 28, { align: "center" });

          doc.setFontSize(10); doc.setTextColor(0, 0, 0);
          doc.text(`Department/Committee: ${s.dept} (${DEPT_FULL[s.dept] || 'Committee'})`, 14, 40);
          doc.text(`Reporting Period: ${s.month} ${s.year}`, 14, 46);
          doc.text(`Submission ID: ${s.id}`, 14, 52);
          const pct = s.complete_pct || s.completePct;
          doc.text(`Status: ${s.status} (${pct}% Complete)`, 14, 58);

          const body = [];
          let reportData = s.report_data || s.reportData || {};
          if (typeof reportData === 'string') {
            try { reportData = JSON.parse(reportData); } catch (e) { reportData = {}; }
          }

          const allPossibleSecs = getAllPossibleSectionsMap();

          Object.keys(reportData).sort((a, b) => {
            return (parseInt(a.replace('Section ', '')) || 0) - (parseInt(b.replace('Section ', '')) || 0);
          }).forEach(secKey => {
            const secNum = secKey.replace('Section ', '');
            const title = allPossibleSecs[secNum] || secKey;
            const val = reportData[secKey];
            if (val) {
              let displayVal = val;
              if (typeof val === 'object') displayVal = JSON.stringify(val, null, 2);
              body.push([`Section ${secNum}:\n${title}`, displayVal]);
            }
          });

          if (body.length === 0) { body.push(["No data provided", ""]); }

          doc.autoTable({
            startY: 65,
            head: [["Report Section", "Submitted Data / Information"]],
            body: body,
            theme: 'grid',
            headStyles: { fillColor: [26, 58, 107] },
            columnStyles: {
              0: { cellWidth: 55, fontStyle: 'bold' },
              1: { cellWidth: 'auto' }
            },
            styles: { overflow: 'linebreak', cellPadding: 4, fontSize: 9 }
          });

          doc.save(`IQAC_Report_${s.dept}_${s.month}_${s.year}.pdf`);
        } catch (err) {
          console.error(err);
          showToast("PDF Export Failed.");
        }
      }, 500);
    }

    <div class="card-body">

        <div style="flex:1;border-left:3px solid ${color};padding-left:.75rem;">

    function openUploadCalendar() {
      openModal('Upload Calendar Document', `
        <div class="form-group">
            <label class="form-label">Document Title</label>
            <input type="text" class="form-control" id="cal-doc-title" placeholder="e.g. Academic Calendar 2025-26">
        </div>
        <div class="form-group">
            <label class="form-label">Select File (PNG, JPG, WEBP, PDF)</label>
            <input type="file" class="form-control" id="cal-doc-file" accept="image/png, image/jpeg, image/webp, application/pdf">
        </div>
    `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitCalendarDoc()" id="cal-upload-btn">Upload</button>`);
    }

    function submitCalendarDoc() {
      const title = document.getElementById('cal-doc-title').value.trim();
      const fileInput = document.getElementById('cal-doc-file');
      const file = fileInput.files[0];

      if (!title) return showToast("Please provide a document title.");
      if (!file) return showToast("Please select a file to upload.");

      const btn = document.getElementById('cal-upload-btn');
      btn.textContent = 'Uploading...';
      btn.disabled = true;

      const isPDF = file.type === 'application/pdf';
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function (event) {
        if (isPDF) {
          saveCalDocToDB({ title: title, imageData: event.target.result, isPDF: true, date: new Date().toLocaleDateString('en-IN') }, btn);
        } else {
          const img = new Image(); img.src = event.target.result;
          img.onload = function () {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1200; const MAX_HEIGHT = 1200;
            let width = img.width; let height = img.height;
            if (width > height && width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            else if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
            const base64Data = canvas.toDataURL('image/jpeg', 0.7);

            saveCalDocToDB({ title: title, imageData: base64Data, isPDF: false, date: new Date().toLocaleDateString('en-IN') }, btn);
          };
          img.onerror = function () { showToast("Invalid image."); btn.textContent = 'Upload'; btn.disabled = false; }
        }
      };
      reader.onerror = function () { showToast("Failed to read file."); btn.textContent = 'Upload'; btn.disabled = false; }
    }

    async function saveCalDocToDB(payload, btn) {
      try {
        const res = await fetch(`${API_URL}/calendar-docs`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (res.ok) { await fetchCoreData(); closeModal(); showPage('calendar'); showToast("Document uploaded."); return; }
        else { showToast("Failed to save document to database."); btn.textContent = 'Upload'; btn.disabled = false; return; }
      } catch (e) { }

      payload.id = Date.now();
      calendarDocs.unshift(payload);
      closeModal(); showPage('calendar'); showToast("Document uploaded locally.");
    }

    async function deleteCalendarDoc(id) {
      if (!confirm("Are you sure you want to permanently delete this calendar document?")) return;
      try {
        const res = await fetch(`${API_URL}/calendar-docs/${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (res.ok) { await fetchCoreData(); showPage('calendar'); showToast("Document deleted."); return; }
        else { console.warn("Backend error: Endpoint might be missing. Falling back to local delete."); }
      } catch (e) { console.warn("Backend unavailable, using local delete."); }

      calendarDocs = calendarDocs.filter(d => String(d.id) !== String(id));
      showPage('calendar'); showToast("Document deleted locally.");
    }

    window.viewCalendarDoc = function (id) {
      const doc = calendarDocs.find(d => String(d.id) === String(id));
      if (!doc || !doc.imageData) return showToast("Document data not found.");
      fetch(doc.imageData).then(res => res.blob()).then(blob => {
        const blobUrl = URL.createObjectURL(blob);
        const win = window.open(blobUrl, '_blank');
        if (!win) showToast("Pop-up blocked. Please allow pop-ups to view documents.");
        setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
      }).catch(err => { showToast("Failed to open document."); });
    };

    async function submitUser(method, id) {
      const payload = {
        id: document.getElementById('u-id').value,
        name: document.getElementById('u-name').value,
        role: document.getElementById('u-role').value,
        dept: document.getElementById('u-dept').value
      };
      let url = `${API_URL}/users`;
      if (method === 'POST') { payload.pass = document.getElementById('u-pass').value; }
      else { url = `${API_URL}/users/${encodeURIComponent(id)}`; }

      try {
        const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (res.ok) { await fetchCoreData(); closeModal(); showPage('users'); showToast("User saved."); return; }
        else { showToast("Error saving user to database."); return; }
      } catch (e) { }

      if (method === 'POST') { USERS.push(payload); }
      else { const idx = USERS.findIndex(u => u.id === id); if (idx > -1) USERS[idx] = { ...USERS[idx], ...payload }; }
      closeModal(); showPage('users'); showToast("User saved locally.");
    }

    async function deleteUser(id) {
      if (!confirm(`Are you sure you want to permanently delete user ${id}?`)) return;
      try {
        const res = await fetch(`${API_URL}/users/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' }
        });
        if (res.ok) { await fetchCoreData(); closeModal(); showPage('users'); showToast("User deleted."); return; }
        else { showToast("Error deleting user from database."); return; }
      } catch (e) { }

      USERS = USERS.filter(u => u.id !== id);
      closeModal(); showPage('users'); showToast("User deleted locally.");
    }

    async function submitSection() {
      const payload = { title: document.getElementById('sec-title').value, description: document.getElementById('sec-desc').value };

      try {
        const res = await fetch(`${API_URL}/sections`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (res.ok) { await fetchCoreData(); closeModal(); showPage('sections'); showToast("Section added."); return; }
      } catch (e) { }

      const nextId = Math.max(...Object.keys(SECTIONS).map(Number), 22) + 1;
      SECTIONS[nextId] = payload.title;
      customSections.push({ sec_num: nextId, title: payload.title, description: payload.description });
      closeModal(); showPage('sections'); showToast("Section added locally.");
    }

    async function removeSection(num) {
      if (!confirm("Are you sure you want to permanently remove this section? It will be removed from all reporting forms.")) return;
      try { const res = await fetch(`${API_URL}/sections/${num}`, { method: 'DELETE' }); } catch (e) { }
      delete SECTIONS[num];
      customSections = customSections.filter(s => s.sec_num != num);
      showPage('sections'); showToast("Section removed.");
    }

      const deptList = uniqueDepts.length > 0 ? uniqueDepts : DEPARTMENTS;
      document.getElementById('dept-report-content').innerHTML = getDeptReportContent(deptList[idx]);

    function getDeptReportContent(deptName) {
      const deptSubs = submissions.filter(s => s.dept === deptName);
      const avg = deptSubs.length ? Math.round(deptSubs.reduce((a, b) => a + (b.complete_pct || b.completePct), 0) / deptSubs.length) : 0;

      return `
    <div class="kpi-grid">
      <div class="kpi-card ${statusClass(avg)} blue"><div class="kpi-label">Completion Average</div><div class="kpi-value">${avg}%</div></div>
      <div class="kpi-card gold"><div class="kpi-label">Status</div><div class="kpi-value" style="font-size:1.1rem;margin-top:.3rem;"><span class="badge ${statusClass(avg)}" style="font-size:.9rem;">${statusLabel(avg)}</span></div></div>
      <div class="kpi-card green"><div class="kpi-label">Total Submissions</div><div class="kpi-value">${deptSubs.length}</div></div>
    </div>
    
    <div class="card">
        <div class="card-header"><span class="card-title">Submission History for ${deptName}</span></div>
        <div class="card-body">
          <div style="display:flex; flex-direction:column; gap:12px;">
            ${deptSubs.length === 0 ? '<div style="text-align:center; padding: 20px; color: var(--gray-400);">No history available.</div>' : ''}
            ${deptSubs.map(s => {

      return `

    function downloadAllReports() {
      const deptSubs = submissions.filter(s => DEPARTMENTS.includes(s.dept));
      if (deptSubs.length === 0) return showToast("No department submissions to export");
      showToast("Generating institutional PDF...");
      setTimeout(() => {
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.setFontSize(18); doc.setTextColor(15, 42, 92);
          doc.text("DLBC Academic Departments Summary", 105, 20, { align: "center" });
          doc.setFontSize(10); doc.text(`Generated on: ${new Date().toLocaleString()}`, 20, 30);
          const head = [["Report ID", "Department", "Period", "Status", "Completion"]];
          const body = deptSubs.map(s => [s.id, s.dept, `${s.month} ${s.year}`, s.status, `${s.complete_pct || s.completePct}%`]);
          doc.autoTable({ startY: 40, head: head, body: body, theme: 'grid', headStyles: { fillColor: [26, 58, 107] } });
          doc.save(`Academic_Summary_${new Date().toISOString().slice(0, 10)}.pdf`);
        } catch (err) { console.error(err); }
      }, 500);
    }

    function downloadCommitteeReports() {
      const commSubs = submissions.filter(s => COMMITTEES.includes(s.dept));

      setTimeout(() => {

          doc.save(`Committee_Summary_${new Date().toISOString().slice(0, 10)}.pdf`);
