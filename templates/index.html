                    <div class="field-row cols-2"><div class="field"><label>Faculty Name</label><input type="text" data-sec="13"/></div><div class="field"><label>Award Title</label><input type="text" data-sec="13"/></div></div>
                  </div>
                </div>
                <button class="add-row-btn" onclick="addRep('faward', '13')">+ Add another award</button>
              `) : ''}
              ${SECTIONS[14] ? secCard(14, SECTIONS[14], '', `
                <div id="sach-list">
                  <div class="repeatable" id="sach-0">
                    <button class="remove-btn" onclick="removeRep('sach',0)">✕ remove</button>
                    <div class="field-row cols-2"><div class="field"><label>Student Name</label><input type="text" data-sec="14"/></div><div class="field"><label>Event Name</label><input type="text" data-sec="14"/></div></div>
                  </div>
                </div>
                <button class="add-row-btn" onclick="addRep('sach', '14')">+ Add another achievement</button>
              `) : ''}
              ${SECTIONS[15] ? secCard(15, SECTIONS[15], '', `
                <div class="field-row cols-2">
                  <div class="field"><label>No. of Students Placed</label><input type="number" data-sec="15" /></div>
                  <div class="field"><label>Average CTC</label><input type="number" step="0.01" data-sec="15" /></div>
                </div>
              `) : ''}
              ${SECTIONS[16] ? secCard(16, SECTIONS[16], '', `
                <div id="hs-list">
                  <div class="repeatable" id="hs-0">
                    <button class="remove-btn" onclick="removeRep('hs',0)">✕ remove</button>
                    <div class="field-row cols-2"><div class="field"><label>University / Institute</label><input type="text" data-sec="16"/></div><div class="field"><label>Country</label><input type="text" data-sec="16"/></div></div>
                  </div>
                </div>
                <button class="add-row-btn" onclick="addRep('hs', '16')">+ Add another student</button>
              `) : ''}
              ${SECTIONS[17] ? secCard(17, SECTIONS[17], '', `
                <div id="infra-list">
                  <div class="repeatable" id="infra-0">
                    <button class="remove-btn" onclick="removeRep('infra',0)">✕ remove</button>
                    <div class="field-row cols-2"><div class="field"><label>Description</label><input type="text" data-sec="17"/></div><div class="field"><label>Cost (₹)</label><input type="number" data-sec="17"/></div></div>
                  </div>
                </div>
                <button class="add-row-btn" onclick="addRep('infra', '17')">+ Add another item</button>
              `) : ''}
              ${SECTIONS[18] ? secCard(18, SECTIONS[18], '', `
                <div class="field-row cols-3"><div class="field"><label>Professors Joined</label><input type="number" min="0" data-sec="18" /></div><div class="field"><label>Assoc. Professors</label><input type="number" min="0" data-sec="18" /></div><div class="field"><label>Asst. Professors</label><input type="number" min="0" data-sec="18" /></div></div>
              `) : ''}
              ${SECTIONS[19] ? secCard(19, SECTIONS[19], '', `
                <div class="field-row cols-2"><div class="field"><label>Internships Undertaken (No.)</label><input type="number" data-sec="19" /></div><div class="field"><label>Revenue from Consultancy</label><input type="number" data-sec="19" /></div></div>
              `) : ''}
            </div>

            <div id="form-p2" class="f-page" style="display:none;">
              ${SECTIONS[20] ? secCard(20, SECTIONS[20], '', `
                <div class="field-row cols-2"><div class="field"><label>Skill Development (no.)</label><input type="number" data-sec="20" /></div><div class="field"><label>Bootcamps (no.)</label><input type="number" data-sec="20" /></div></div>
              `) : ''}
              ${SECTIONS[21] ? secCard(21, SECTIONS[21], '', `
                <div id="pba-list">
                  <div class="repeatable" id="pba-0">
                    <button class="remove-btn" onclick="removeRep('pba',0)">✕ remove</button>
                    <div class="field-row cols-2"><div class="field"><label>Activity Name</label><input type="text" data-sec="21"/></div><div class="field"><label>Date</label><input type="date" data-sec="21"/></div></div>
                  </div>
                </div>
                <button class="add-row-btn" onclick="addRep('pba', '21')">+ Add another activity</button>
              `) : ''}
              ${SECTIONS[22] ? secCard(22, SECTIONS[22], '', `
                <div class="field-row cols-1"><div class="field"><label>Details</label><textarea data-sec="22" rows="3" placeholder="Additional achievements or information"></textarea></div></div>
              `) : ''}
              ${dynamicSectionsHTML}
            </div>

            <div id="form-p3" class="f-page" style="display:none;">
              <div class="sec-card" id="review-summary"><p>Click "Review & Submit" to see summary.</p></div>
              <div class="sec-card" style="border:1px solid #bbf7d0;background:#f0fdf4;">
                <div style="font-size:.9rem;font-weight:600;color:#15803d;margin-bottom:.5rem;">✅ Ready to Submit?</div>
                <div style="display:flex;gap:.6rem; margin-bottom: 10px;">
                  <button class="btn btn-primary" onclick="submitFormReport()">Submit Report</button>
                </div>
              </div>
              <div style="margin-top: 15px;">
                  <button class="btn btn-secondary" onclick="window.print()">🖨️ Print Form Data</button>
              </div>
            </div>
        </div>
        `;
      } else {
        html = `
        <div class="tab-nav" id="form-tabs">
            <button class="tab-btn active" onclick="showFormPage(0)">Meeting Report</button>
            <button class="tab-btn" onclick="showFormPage(1);buildFormReview()">Review & Submit</button>
        </div>
        <div id="form-pages-container" class="print-show-all">
            <div id="form-p0" class="f-page">
                ${secCard(101, 'Meeting Circular & Details', 'Enter meeting basic details and upload the circular below', `
                  <div class="field-row cols-2">
                    <div class="field"><label>Date of Meeting</label><input type="date" data-sec="101" /></div>
                    <div class="field"><label>No. of Members Attended</label><input type="number" min="0" data-sec="101" /></div>
                  </div>
                  <div class="field-row cols-1">
                    <div class="field"><label>Circular Reference / Context</label><textarea data-sec="101" rows="2" placeholder="Brief circular context..."></textarea></div>
                  </div>
                `)}
                ${secCard(102, 'Minutes of Meeting (MoM)', 'Summarize key points discussed', `
                  <div class="field-row cols-1"><div class="field"><textarea data-sec="102" rows="4" placeholder="Enter Minutes of Meeting here..."></textarea></div></div>
                `)}
                ${secCard(103, 'Action Plan', 'Planned actions based on the meeting', `
                  <div class="field-row cols-1"><div class="field"><textarea data-sec="103" rows="3" placeholder="Enter Action Plan..."></textarea></div></div>
                `)}
                ${secCard(104, 'Action Taken Report', 'Report on previously planned actions', `
                  <div class="field-row cols-1"><div class="field"><textarea data-sec="104" rows="3" placeholder="Enter Action Taken Report..."></textarea></div></div>
                `)}
            </div>
            
            <div id="form-p1" class="f-page" style="display:none;">
              <div class="sec-card" id="review-summary"><p>Click "Review & Submit" to see summary.</p></div>
              <div class="sec-card" style="border:1px solid #bbf7d0;background:#f0fdf4;">
                <div style="font-size:.9rem;font-weight:600;color:#15803d;margin-bottom:.5rem;">✅ Ready to Submit Meeting Report?</div>
                <div style="display:flex;gap:.6rem; margin-bottom: 10px;">
                  <button class="btn btn-primary" onclick="submitFormReport()">Submit Report</button>
                </div>
              </div>
              <div style="margin-top: 15px;">
                  <button class="btn btn-secondary" onclick="window.print()">🖨️ Print Report</button>
              </div>
            </div>
        </div>
        `;
      }

      html += `
    <div style="background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:.85rem 1.25rem;display:flex;align-items:center;justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:.75rem;box-shadow:var(--shadow);">
        <div style="display:flex;gap:.5rem;">
          <button class="btn btn-secondary" id="form-prev" onclick="changeFormPage(-1)" disabled>← Previous</button>
          <button class="btn btn-secondary" id="form-next" onclick="changeFormPage(1)">Next →</button>
        </div>
        <div style="display:flex;align-items:center;gap:.8rem;">
          <span id="auto-save-status" style="font-size:11px;color:var(--gray-400);"></span>
          <button class="btn btn-gold" onclick="submitFormReport(true)">💾 Save as Draft</button>
        </div>
    </div>`;

      document.getElementById('dynamic-form-area').innerHTML = html;
      formPage = 0;

      const nextBtn = document.getElementById('form-next');
      if (nextBtn) nextBtn.disabled = false;

      updateFormProgress();
    }

    function secCard(num, title, sub, content) {
      return `<div class="sec-card">
    <div class="sec-title"><div class="sec-num" style="background:${num > 100 ? 'var(--gold)' : 'var(--navy)'}">${num > 100 ? '' : num}</div><div class="sec-title-text">${title}</div></div>
    ${sub ? `<div class="sec-sub" style="margin-left:${num > 100 ? '0' : '30px'};">${sub}</div>` : ''}
    ${content}
    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--gray-200);">
        <label style="font-size: 11px; color: var(--navy-mid); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; background: var(--navy-subtle); padding: 4px 10px; border-radius: 4px; border: 1px dashed var(--navy-mid);">
        📎 Attach Evidence (PDF/Images)
        <input type="file" multiple style="display:none;" onchange="window.handleFileSelect(this, '${num}')">
        </label>
        <div id="file-list-${num}" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;"></div>
    </div>
  </div>`;
    }

    let formPage = 0;
    let repCounters = {};

    function initRepeatables() {
      document.addEventListener('input', updateFormProgress);
      document.addEventListener('change', updateFormProgress);
      formPage = 0;
    }

    function addRep(id, sec) {
      repCounters[id] = (repCounters[id] || 0) + 1;
      const c = repCounters[id];
      const list = document.getElementById(id + '-list');
      if (!list) return;
      const div = document.createElement('div');
      div.className = 'repeatable';
      div.id = id + '-' + c;

      const first = list.querySelector('.repeatable');
      if (first) {
        div.innerHTML = '<button class="remove-btn" onclick="removeRep(\'' + id + '\',' + c + ')">✕ remove</button>' + first.innerHTML.replace(/<button class="remove-btn"[^>]*>[^<]*<\/button>/, '');
        div.querySelectorAll('input').forEach(el => { if (el.type !== 'file') el.value = ''; el.checked = false; });
        div.querySelectorAll('textarea').forEach(el => el.value = '');
        div.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
      }
      list.appendChild(div);
      updateFormProgress();
    }

    function removeRep(id, idx) {
      const el = document.getElementById(id + '-' + idx);
      if (el) el.remove();
      updateFormProgress();
    }

    function updateFormProgress() {
      const filled = new Set();
      document.querySelectorAll('[data-sec]').forEach(el => {
        const v = el.value || el.checked;
        if (v && String(v).trim()) filled.add(el.getAttribute('data-sec'));
      });

      const currentSecMap = getCurrentSectionsMap();
      const totalSecs = Object.keys(currentSecMap).length;
      const c = filled.size;
      const pct = totalSecs > 0 ? Math.round((c / totalSecs) * 100) : 0;

      const fill = document.getElementById('form-prog-fill');
      const label = document.getElementById('form-prog-label');
      if (fill) fill.style.width = pct + '%';
      if (label) label.textContent = `${c} of ${totalSecs} sections filled (${pct}%)`;

      const autoSaveStatus = document.getElementById('auto-save-status');
      if (autoSaveStatus) {
        autoSaveStatus.textContent = 'Saving locally...';
        setTimeout(() => { autoSaveStatus.textContent = 'Saved just now'; }, 800);
      }
    }

    function showFormPage(n) {
      const pages = document.querySelectorAll('.f-page');
      const tabs = document.querySelectorAll('#form-tabs .tab-btn');
      if (n < 0 || n >= pages.length) return;

      pages.forEach((el, i) => { el.style.display = (i === n) ? 'block' : 'none'; });
      tabs.forEach((b, i) => b.classList.toggle('active', i === n));

      formPage = n;
      const prev = document.getElementById('form-prev'), next = document.getElementById('form-next');
      if (prev) prev.disabled = (n === 0);
      if (next) next.disabled = (n === pages.length - 1);
    }

    function changeFormPage(dir) {
      const pages = document.querySelectorAll('.f-page');
      showFormPage(Math.max(0, Math.min(pages.length - 1, formPage + dir)));
    }

    function buildFormReview() {
      const filled = {};
      document.querySelectorAll('[data-sec]').forEach(el => {
        const s = el.getAttribute('data-sec');
        const v = el.value || el.checked;
        if (v && String(v).trim()) { if (!filled[s]) filled[s] = true; }
      });
      let html = `<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:.4rem;">`;

      const currentSecMap = getCurrentSectionsMap();
      Object.keys(currentSecMap).forEach(s => {
        const done = filled[s];
        const prefix = parseInt(s) > 100 ? '' : `S.${s}: `;
        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:.4rem .6rem;background:${done ? 'var(--green-bg)' : 'var(--gray-50)'};border-radius:4px;">
      <span style="font-size:.73rem;color:${done ? 'var(--green)' : 'var(--gray-400)'};">${prefix}${currentSecMap[s]}</span>
      <span style="font-size:.7rem;font-weight:600;color:${done ? 'var(--green)' : 'var(--gray-300)'};">${done ? '✓' : '—'}</span>
    </div>`;
      });
      html += '</div>';
      document.getElementById('review-summary').innerHTML = html;
    }

    // ════════════════════════════════════════════
    // DATA CAPTURE LOGIC
    // ════════════════════════════════════════════
    async function submitFormReport(isDraft = false) {
      const deptEl = document.getElementById('rep-dept');
      const dept = deptEl ? deptEl.value : (currentUser.dept ? currentUser.dept.split(',')[0].trim() : 'Institution');
      const month = document.getElementById('rep-month').value;
      const year = document.getElementById('rep-year').value;
      if (!dept) { showToast('Department not set.'); return; }

      const filled = new Set();
      const reportData = {};

      document.querySelectorAll('[data-sec]').forEach(el => {
        const v = el.type === 'checkbox' ? el.checked : el.value;
        if (v && String(v).trim() && String(v) !== 'false') {
          const secID = el.getAttribute('data-sec');
          filled.add(secID);

          let labelText = '';
          const wrapper = el.closest('.field') || el.closest('.checkbox-item');
          const labelEl = wrapper ? wrapper.querySelector('label') : null;
          if (labelEl) labelText = labelEl.textContent.trim();
          else labelText = el.placeholder || 'Value';

          const entry = labelText ? `${labelText}: ${v === true ? 'Yes' : v}` : v;

          if (!reportData[`Section ${secID}`]) reportData[`Section ${secID}`] = [];
          reportData[`Section ${secID}`].push(entry);
        }
      });

      Object.keys(reportData).forEach(k => {
        reportData[k] = reportData[k].join('\n');
      });

      const currentSecMap = getCurrentSectionsMap();
      const totalSectionsForThisForm = Object.keys(currentSecMap).length;

      const newId = 'SUB-' + Math.random().toString(36).substr(2, 6).toUpperCase();
      const payload = {
        id: newId, dept, month, year, status: isDraft ? 'Draft' : 'Pending', sections: filled.size,
        completePct: Math.round((filled.size / totalSectionsForThisForm) * 100), reportData: reportData
      };

      try {
        const res = await fetch(`${API_URL}/submissions`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        if (res.ok) {
          await fetchCoreData();
          showToast(isDraft ? `✓ Draft saved securely.` : `✓ Report submitted for review.`);
          if (!isDraft) showPage('submissions');
          return;
        }
      } catch (e) { }

      submissions.unshift({ id: payload.id, dept: payload.dept, month: payload.month, year: payload.year, status: isDraft ? 'Draft' : 'Pending', created_at: new Date().toISOString(), sections: payload.sections, complete_pct: payload.completePct, report_data: payload.reportData });
      showToast(isDraft ? `✓ Draft saved locally.` : `✓ Report saved locally.`);
      if (!isDraft) showPage('submissions');
    }

    function openModal(title, body, footer = '') {
      document.getElementById('modal-title').textContent = title; document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal-footer').innerHTML = footer || '<button class="btn btn-secondary" onclick="closeModal()">Close</button>';
      document.getElementById('modal-overlay').classList.add('open');
    }
    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    function showToast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>

</html>
