<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DLBC IQA Tool — Dr. Lankapalli Bullayya College of Engineering</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --navy: #0f2a5c;
      --navy-mid: #1a3a6b;
      --navy-light: #1e4080;
      --navy-pale: #e8eef8;
      --navy-subtle: #f0f4fb;
      --gold: #c8962a;
      --gold-light: #f5d98a;
      --white: #ffffff;
      --gray-50: #f8f9fc;
      --gray-100: #f0f2f7;
      --gray-200: #e2e6f0;
      --gray-300: #c8cfe0;
      --gray-400: #9aa3bb;
      --gray-500: #6b7494;
      --gray-700: #3d4463;
      --gray-900: #1a1f36;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --orange: #d97706;
      --orange-bg: #fef3c7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 1px 3px rgba(15, 42, 92, 0.08), 0 4px 16px rgba(15, 42, 92, 0.06);
      --shadow-lg: 0 8px 32px rgba(15, 42, 92, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }
    button, input, select, textarea { font-family: 'DM Sans', sans-serif; }
    button { cursor: pointer; }

    /* ─── AUTH ─── */
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a1f44 0%, #1a3a6b 50%, #0f2a5c 100%); padding: 1rem; }
    .auth-card { background: #fff; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo-circle { width: 64px; height: 64px; background: var(--navy); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem; }
    .auth-logo-circle span { color: #fff; font-size: 14px; font-weight: 600; line-height: 1.2; text-align: center; }
    .auth-logo h2 { font-size: 1.1rem; font-weight: 700; color: var(--navy); }
    .auth-logo p { font-size: .8rem; color: var(--gray-500); margin-top: 3px; }
    .auth-form-group { margin-bottom: 1rem; }
    .auth-form-group label { display: block; font-size: .8rem; font-weight: 500; color: var(--gray-700); margin-bottom: .35rem; }
    .auth-input { width: 100%; padding: .65rem .9rem; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: .9rem; transition: border .2s; }
    .auth-input:focus { outline: none; border-color: var(--navy-mid); }
    .auth-btn { width: 100%; padding: .75rem; background: var(--navy); color: #fff; border: none; border-radius: var(--radius-sm); font-size: .95rem; font-weight: 600; margin-top: .5rem; transition: background .2s; }
    .auth-btn:hover { background: var(--navy-light); }
    .auth-error { background: #fee2e2; color: #991b1b; padding: .6rem .9rem; border-radius: var(--radius-sm); font-size: .82rem; margin-bottom: .75rem; }

    /* ─── LAYOUT ─── */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--navy); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; transition: transform .3s ease; }
    .sidebar-logo { padding: 1.25rem 1.25rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, .1); }
    .sidebar-logo-row { display: flex; align-items: center; gap: 10px; }
    .sidebar-logo-circle { width: 36px; height: 36px; background: rgba(255, 255, 255, .15); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sidebar-logo-circle span { color: #fff; font-size: 10px; font-weight: 600; text-align: center; line-height: 1.2; }
    .sidebar-logo-text h3 { color: #fff; font-size: .8rem; font-weight: 600; line-height: 1.2; }
    .sidebar-logo-text p { color: rgba(255, 255, 255, .55); font-size: .65rem; margin-top: 1px; }
    
    .sidebar-user { padding: .9rem 1.25rem; border-bottom: 1px solid rgba(255, 255, 255, .1); }
    .sidebar-user-name { color: #fff; font-size: .82rem; font-weight: 600; }
    .sidebar-user-role { color: rgba(255, 255, 255, .55); font-size: .72rem; margin-top: 2px; }
    .sidebar-user-dept { color: var(--gold-light); font-size: .7rem; margin-top: 2px; word-wrap: break-word; line-height: 1.3; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: .75rem 0; }
    .nav-section-label { padding: .4rem 1.25rem .2rem; font-size: .65rem; font-weight: 600; color: rgba(255, 255, 255, .35); text-transform: uppercase; letter-spacing: .08em; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: .55rem 1.25rem; color: rgba(255, 255, 255, .7); font-size: .82rem; cursor: pointer; transition: all .15s; border-left: 3px solid transparent; }
    .nav-item:hover { background: rgba(255, 255, 255, .08); color: #fff; }
    .nav-item.active { background: rgba(255, 255, 255, .12); color: #fff; border-left-color: var(--gold); }
    .nav-item-icon { font-size: 1rem; width: 18px; text-align: center; flex-shrink: 0; }
    .sidebar-footer { padding: .9rem 1.25rem; border-top: 1px solid rgba(255, 255, 255, .1); display: flex; flex-direction: column; gap: 5px; }
    .logout-btn { width: 100%; padding: .5rem; background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .7); border: 1px solid rgba(255, 255, 255, .12); border-radius: var(--radius-sm); font-size: .8rem; transition: all .15s; }
    .logout-btn:hover { background: rgba(255, 255, 255, .15); color: #fff; }
    .pwd-btn { width: 100%; padding: .5rem; background: transparent; color: var(--gold-light); border: none; border-radius: var(--radius-sm); font-size: .75rem; transition: all .15s; }
    .pwd-btn:hover { background: rgba(255, 255, 255, .05); }

    /* Mobile Toggle & Overlay */
    .mobile-toggle { display: none; background: var(--navy-subtle); border: 1px solid var(--gray-200); font-size: 1.4rem; color: var(--navy); cursor: pointer; padding: 0.3rem 0.5rem; border-radius: var(--radius-sm); line-height: 1; transition: background 0.2s; }
    .mobile-toggle:hover { background: var(--gray-200); }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(10, 20, 44, 0.5); z-index: 90; display: none; opacity: 0; transition: opacity 0.3s; }
    .sidebar-overlay.open { display: block; opacity: 1; }

    .main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: #fff; border-bottom: 1px solid var(--gray-200); padding: .75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .topbar-title { font-size: 1rem; font-weight: 600; color: var(--navy); }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .page-content { padding: 1.5rem; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }

    /* ─── COMPONENTS ─── */
    .notif-btn { position: relative; background: none; border: none; font-size: 1.1rem; color: var(--gray-500); padding: .2rem; }
    .notif-badge { position: absolute; top: -2px; right: -2px; width: 16px; height: 16px; background: var(--red); border-radius: 50%; font-size: .55rem; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .notif-item { display: flex; gap: .75rem; padding: .75rem 0; border-bottom: 1px solid var(--gray-100); transition: opacity 0.2s; }
    .notif-item:last-child { border-bottom: none; }
    .notif-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: .3rem; }
    .notif-dot.critical { background: var(--red); }
    .notif-dot.warning { background: var(--orange); }
    .notif-dot.info { background: var(--navy-mid); }
    .notif-text { font-size: .8rem; color: var(--gray-700); line-height: 1.4; }
    .notif-time { font-size: .7rem; color: var(--gray-400); margin-top: 2px; }

    .card { background: #fff; border-radius: var(--radius); border: 1px solid var(--gray-200); box-shadow: var(--shadow); }
    .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .card-title { font-size: .9rem; font-weight: 600; color: var(--navy); }
    .card-body { padding: 1.25rem; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .kpi-card { background: #fff; border-radius: var(--radius); border: 1px solid var(--gray-200); padding: 1.1rem 1.25rem; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .kpi-card.blue::before { background: var(--navy-mid); }
    .kpi-card.gold::before { background: var(--gold); }
    .kpi-card.green::before { background: var(--green); }
    .kpi-card.red::before { background: var(--red); }
    .kpi-label { font-size: .75rem; font-weight: 500; color: var(--gray-500); margin-bottom: .3rem; }
    .kpi-value { font-size: 1.8rem; font-weight: 700; color: var(--navy); font-family: 'DM Mono', monospace; }
    .kpi-sub { font-size: .72rem; color: var(--gray-400); margin-top: .2rem; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1rem; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: .72rem; font-weight: 600; }
    .badge.good { background: var(--green-bg); color: var(--green); }
    .badge.risk { background: var(--orange-bg); color: var(--orange); }
    .badge.critical { background: var(--red-bg); color: var(--red); }
    .badge.pending { background: #f0f4fb; color: var(--navy-mid); }
    .badge.approved { background: #dcfce7; color: #15803d; }
    .badge.rejected { background: #fee2e2; color: #991b1b; }
    .badge.info { background: var(--navy-subtle); color: var(--navy-mid); }
    .badge.gold { background: var(--gold-light); color: var(--navy-mid); }

    .heatmap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: .5rem; }
    .heatmap-cell { border-radius: var(--radius-sm); padding: .6rem .5rem; text-align: center; }
    .heatmap-cell .dept-name { font-size: .65rem; font-weight: 600; color: var(--navy); margin-bottom: .2rem; }
    .heatmap-cell .dept-pct { font-size: 1.1rem; font-weight: 700; font-family: 'DM Mono', monospace; }
    .heatmap-cell.good { background: #dcfce7; }
    .heatmap-cell.good .dept-pct { color: #15803d; }
    .heatmap-cell.risk { background: #fef3c7; }
    .heatmap-cell.risk .dept-pct { color: #d97706; }
    .heatmap-cell.critical { background: #fee2e2; }
    .heatmap-cell.critical .dept-pct { color: #dc2626; }

    .prog-wrap { background: var(--gray-200); border-radius: 4px; overflow: hidden; width: 100%; height: 6px; }
    .prog-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease-in-out; }
    .prog-fill.good { background: var(--green); }
    .prog-fill.risk { background: var(--orange); }
    .prog-fill.critical { background: var(--red); }
    .prog-fill.navy { background: var(--navy-mid); }

    /* ─── MODALS, FORMS, & UTILITIES ─── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(10, 20, 44, 0.6); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; opacity: 0; transition: opacity 0.2s; }
    .modal-overlay.open { display: flex; opacity: 1; }
    .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 550px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); transform: translateY(20px); transition: transform 0.2s; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--navy); }
    .modal-close { background: none; border: none; font-size: 1.2rem; color: var(--gray-500); cursor: pointer; transition: color 0.2s; padding: 0.2rem;}
    .modal-close:hover { color: var(--red); }
    .modal-body { padding: 1.5rem; overflow-y: auto; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 0.75rem; background: var(--gray-50); border-radius: 0 0 12px 12px; }

    .form-group { margin-bottom: 1rem; width: 100%; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--gray-700); margin-bottom: 0.4rem; }
    .form-control { width: 100%; padding: 0.65rem 0.85rem; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 0.9rem; transition: border 0.2s; background: #fff; font-family: inherit; }
    .form-control:focus { outline: none; border-color: var(--navy-mid); }
    .form-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; width: 100%; }
    .form-row.cols-2 > .form-group { flex: 1; min-width: 200px; margin-bottom: 0; }
    .form-row.cols-3 > .form-group { flex: 1; min-width: 150px; margin-bottom: 0; }
    .form-row.cols-4 > .form-group { flex: 1; min-width: 120px; margin-bottom: 0; }

    .btn { padding: 0.6rem 1.1rem; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; font-family: inherit; }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.75rem; }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-secondary { background: var(--gray-50); color: var(--gray-700); border: 1px solid var(--gray-200); }
    .btn-secondary:hover { background: var(--gray-200); }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fecaca; }
    .btn-success { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .btn-success:hover { background: #bbf7d0; }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-gold:hover { background: #b48523; }

    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--navy-mid); color: #fff; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: var(--shadow-lg); font-size: 0.9rem; font-weight: 500; transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 2000; }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* TABS & REPORT FORM ELEMENTS */
    .tab-nav { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 2px solid var(--gray-200); padding-bottom: 0.5rem; overflow-x: auto; }
    .tab-btn { background: none; border: none; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; color: var(--gray-500); cursor: pointer; border-radius: var(--radius-sm); transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { background: var(--gray-100); color: var(--navy); }
    .tab-btn.active { background: var(--navy); color: #fff; }
    
    .sec-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .sec-title { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .sec-num { width: 28px; height: 28px; background: var(--navy); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; font-family: 'DM Mono', monospace; flex-shrink: 0; }
    .sec-title-text { font-size: 1.05rem; font-weight: 600; color: var(--navy); }
    .sec-sub { font-size: 0.8rem; color: var(--gray-500); margin-bottom: 1rem; }
    .field-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    .field { flex: 1; min-width: 180px; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--gray-600); margin-bottom: 0.3rem; }
    .field input, .field select, .field textarea { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--gray-300); border-radius: 4px; font-size: 0.85rem; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--navy-mid); }
    .repeatable { padding: 1rem; border: 1px dashed var(--gray-300); border-radius: var(--radius-sm); margin-bottom: 1rem; position: relative; background: var(--gray-50); }
    .remove-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: #fee2e2; color: #dc2626; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer; font-weight: 600;}
    .add-row-btn { background: none; border: 1px dashed var(--navy-mid); color: var(--navy-mid); padding: 0.6rem 1rem; width: 100%; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .add-row-btn:hover { background: var(--navy-subtle); }

    /* Mobile Responsiveness */
    @media(max-width:900px) {
      .mobile-toggle { display: flex; align-items: center; justify-content: center; }
      .sidebar { transform: translateX(-100%); box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; width: 100%; overflow-x: hidden; }
      .topbar { padding: 0.75rem 1rem; }
      .topbar-title { font-size: 0.95rem; }
      .page-content { padding: 1rem; }
      .grid-2, .kpi-grid, .field-row.cols-2, .field-row.cols-3, .field-row.cols-4 { grid-template-columns: 1fr !important; }
      .hide-on-mobile { display: none !important; }
    }
  </style>
</head>

<body>

  <div id="auth-screen" class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-circle"><span>LB<br>CoE</span></div>
        <h2>Dr. Lankapalli Bullayya<br>College of Engineering</h2>
        <p>Internal Quality Assurance Cell — IQA Tool</p>
      </div>
      <div id="auth-error" class="auth-error" style="display:none;"></div>
      <div id="login-step">
        <div class="auth-form-group">
          <label>Employee ID / Email</label>
          <input class="auth-input" id="auth-id" placeholder="e.g. narasimha@dlbce.ac.in" />
        </div>
        <div class="auth-form-group">
          <label>Password</label>
          <input class="auth-input" type="password" id="auth-pass" placeholder="Enter password" />
        </div>
        <button class="auth-btn" onclick="doLogin()">Log In</button>
      </div>
    </div>
  </div>

  <div id="app-shell" class="app-shell" style="display:none;">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-row">
          <div class="sidebar-logo-circle"><span>LB<br>CoE</span></div>
          <div class="sidebar-logo-text">
            <h3>DLBC IQA Tool</h3>
            <p>Quality Assurance Platform</p>
          </div>
        </div>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-name" id="sb-user-name">Loading...</div>
        <div class="sidebar-user-role" id="sb-user-role">—</div>
        <div class="sidebar-user-dept" id="sb-user-dept"></div>
      </div>
      <div class="sidebar-nav" id="sidebar-nav"></div>
      <div class="sidebar-footer">
        <button class="pwd-btn" onclick="openChangePassword()">🔑 Change Password</button>
        <button class="logout-btn" onclick="doLogout()">⎋ Logout</button>
      </div>
    </nav>

    <div class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
          <span class="topbar-title" id="page-title">Dashboard</span>
        </div>
        <div class="topbar-right">
          <span class="hide-on-mobile" style="font-size:.78rem;color:var(--gray-400);margin-right:.5rem;"
            id="topbar-date"></span>
          <button class="notif-btn" onclick="showPage('notifications')">🔔<span class="notif-badge" id="notif-badge"
              style="display:none;">0</span></button>
        </div>
      </div>
      <div class="page-content" id="page-content"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Modal</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ════════════════════════════════════════════
    // CONFIG & DATA STORE
    // ════════════════════════════════════════════
    const API_URL = '/api';
    let currentUser = null;

    let submissions = [];
    let calendarEvents = [];
    let calendarDocs = [];
    let customSections = [];
    let notifications = [];
    let departmentsData = {};
    let USERS = []; 

    // Dynamic Lists loaded from Database
    let DEPARTMENTS = [];
    let COMMITTEES = [];
    let COMMITTEE_SECTIONS = {}; // Map of sec_num -> title
    let committeeSectionsData = []; // Array of {sec_num, title, description}

    // Full names mapping (fallback for known standard depts)
    const DEPT_FULL = {
      CSE: 'Computer Science Engineering', Civil: 'Civil Engineering',
      ECE: 'Electronics & Communication Engineering', EEE: 'Electrical & Electronics Engineering',
      BHS: 'Basic & Humanities Sciences'
    };

    let SECTIONS = {
      1: 'Workshops Organised', 2: 'Workshops Attended', 3: 'Conferences Organised',
      4: 'Conference Papers Presented', 5: 'Guest Lectures Organised', 6: 'Resource Person Activity',
      7: 'Publications (Journal Papers)', 8: 'Book Chapters / Books Published',
      9: 'Student-centric T&L Methodologies', 10: 'e-Learning Practices',
      11: 'Funded Projects', 12: 'Patents Published / Granted',
      13: 'Faculty Awards / Achievements', 14: 'Student Achievements',
      15: 'Student Placement', 16: 'Higher Studies', 17: 'Infrastructure',
      18: 'Man Power', 19: 'Student Support Systems', 20: 'Capacity Building',
      21: 'Professional Body Activities', 22: 'Any Other Information'
    };

    function getCurrentSectionsMap() {
      const deptEl = document.getElementById('rep-dept');
      const dept = deptEl ? deptEl.value : (currentUser.dept ? currentUser.dept.split(',')[0].trim() : '');
      const isStandard = !dept || DEPARTMENTS.includes(dept) || dept === 'R&D' || dept === 'SDC / Internship / Placement / III Cell / Career Guidance';

      if (isStandard) {
        const currentSecs = { ...SECTIONS };
        customSections.forEach(cs => { currentSecs[cs.sec_num] = cs.title; });
        return currentSecs;
      } else {
        return COMMITTEE_SECTIONS;
      }
    }

    function getAllPossibleSectionsMap() {
      const allSecs = { ...SECTIONS, ...COMMITTEE_SECTIONS };
      customSections.forEach(cs => { allSecs[cs.sec_num] = cs.title; });
      return allSecs;
    }

    // ════════════════════════════════════════════
    // UTILITIES
    // ════════════════════════════════════════════
    function formatDBDate(dateString) {
      if (!dateString) return '';
      let d = new Date(dateString);
      if (typeof dateString === 'string' && dateString.includes('T') && !dateString.includes('Z') && !dateString.includes('+')) {
        d = new Date(dateString + 'Z');
      }
      if (isNaN(d.getTime())) return dateString;
      return d.toLocaleString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
      });
    }

    function updateClock() {
      const el = document.getElementById('topbar-date');
      if (el) {
        const now = new Date();
        el.textContent = now.toLocaleString('en-IN', {
          weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        });
      }
    }
    setInterval(updateClock, 1000);

    // ════════════════════════════════════════════
    // AUTH & API FETCHING
    // ════════════════════════════════════════════
    async function doLogin() {
      const id = document.getElementById('auth-id').value.trim();
      const pass = document.getElementById('auth-pass').value;
      if (!id || !pass) { showAuthError('Please enter both ID and Password.'); return; }

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, pass })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            currentUser = data.user;
            if (currentUser && currentUser.role) {
              const r = currentUser.role.trim().toLowerCase();
              if (r === 'super admin') currentUser.role = 'Super Admin';
              else if (r === 'admin') currentUser.role = 'Admin';
              else if (r === 'principal') currentUser.role = 'Principal';
              else if (r === 'hod') currentUser.role = 'HOD';
              else if (r === 'committee head') currentUser.role = 'Committee Head';
              else currentUser.role = currentUser.role.trim();
            }
            hideAuthError();
            launchApp();
            return;
          } else {
            showAuthError(data.message || 'Invalid credentials.');
            return;
          }
        }
      } catch (e) {
        showAuthError("Unable to connect to the database.");
      }
    }

    function showAuthError(msg) { const e = document.getElementById('auth-error'); e.textContent = msg; e.style.display = 'block'; }
    function hideAuthError() { document.getElementById('auth-error').style.display = 'none'; }

    function doLogout() {
      currentUser = null;
      document.getElementById('app-shell').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('auth-pass').value = '';
    }

    function openChangePassword() {
      openModal('Change Password', `
        <div class="form-group"><label class="form-label">New Password</label><input type="password" class="form-control" id="new-pwd" placeholder="Enter new password"></div>
        <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" class="form-control" id="confirm-pwd" placeholder="Confirm new password"></div>
    `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitChangePassword()">Update Password</button>`);
    }

    async function submitChangePassword() {
      const newPass = document.getElementById('new-pwd').value;
      const confirmPass = document.getElementById('confirm-pwd').value;
      if (newPass !== confirmPass) { showToast("Passwords do not match."); return; }
      if (newPass.length < 6) { showToast("Password too short."); return; }

      try {
        const res = await fetch(`${API_URL}/users/${currentUser.id}/password`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ newPass })
        });
        if (res.ok) { showToast("Password updated successfully."); closeModal(); return; }
      } catch (e) { showToast("Failed to update password"); }
    }

    async function fetchCoreData() {
      try {
        // Fetch Dynamic Configs First
        let res = await fetch(`${API_URL}/config`);
        if (res.ok) {
            const cfg = await res.json();
            DEPARTMENTS = cfg.departments.length ? cfg.departments : ['CSE', 'Civil', 'ECE', 'EEE', 'BHS'];
            COMMITTEES = cfg.committees.length ? cfg.committees : ['Anti Ragging and Discipline Committee'];
            
            if(cfg.comm_sections.length) {
                committeeSectionsData = cfg.comm_sections;
                COMMITTEE_SECTIONS = {};
                committeeSectionsData.forEach(s => { COMMITTEE_SECTIONS[s.sec_num] = s.title; });
            }
        }

        res = await fetch(`${API_URL}/submissions`);
        if (res.ok) submissions = await res.json();

        res = await fetch(`${API_URL}/calendar`);
        if (res.ok) calendarEvents = await res.json();

        res = await fetch(`${API_URL}/calendar-docs`);
        if (res.ok) calendarDocs = await res.json();

        res = await fetch(`${API_URL}/notifications`);
        if (res.ok) notifications = await res.json();

        res = await fetch(`${API_URL}/sections`);
        if (res.ok) {
          customSections = await res.json();
          customSections.forEach(s => { SECTIONS[s.sec_num] = s.title; });
        }

        res = await fetch(`${API_URL}/departments-data`);
        if (res.ok) {
          const dbData = await res.json();
          dbData.forEach(row => {
            if (!departmentsData[row.dept]) departmentsData[row.dept] = {};
            departmentsData[row.dept] = { ...departmentsData[row.dept], ...row };
          });
        }

        if (currentUser.role === 'Super Admin' || currentUser.role === 'Admin') {
          res = await fetch(`${API_URL}/users`);
          if (res.ok) USERS = await res.json();
        }
      } catch (e) { console.warn("Fetch failed.", e); }
    }

    // ════════════════════════════════════════════
    async function launchApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-shell').style.display = 'flex';
      document.getElementById('sb-user-name').textContent = currentUser.name;
      document.getElementById('sb-user-role').textContent = currentUser.role;

      let deptText = currentUser.dept ? (DEPT_FULL[currentUser.dept] || currentUser.dept) : 'Institution Level';
      if (currentUser.dept && currentUser.dept.includes(',')) deptText = 'Multiple Committees Assigned';
      document.getElementById('sb-user-dept').textContent = deptText;

      updateClock();
      await fetchCoreData();
      updateNotifBadge();
      buildSidebar();
      showPage('dashboard');
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar) sidebar.classList.toggle('open');
      if (overlay) overlay.classList.toggle('open');

          { section: 'System', links: [{ icon: '📄', label: 'Reports & Export', page: 'reports' }, { icon: '👥', label: 'User Management', page: 'users' }, { icon: '⚙️', label: 'Manage Sections', page: 'sections' }, { icon: '🏢', label: 'Organization Setup', page: 'org' }] },
          { section: 'Help & Support', links: [{ icon: '❓', label: 'User Guide', page: 'guide' }, { icon: '✉️', label: 'Contact IT', page: 'contact' }] }

        ];

          { section: 'My Department', links: [{ icon: '📝', label: 'Submit Report', page: 'submit' }, { icon: '📋', label: 'My Submissions', page: 'submissions' }] },
          { section: 'Resources', links: [{ icon: '📅', label: 'Academic Calendar', page: 'calendar' }] },
          { section: 'Help & Support', links: [{ icon: '❓', label: 'User Guide', page: 'guide' }, { icon: '✉️', label: 'Contact IT', page: 'contact' }] }
        ];
      }

      let html = '';
      items.forEach(sec => {
        html += `<div class="nav-section-label">${sec.section}</div>`;
        sec.links.forEach(l => {
          html += `<div class="nav-item" onclick="showPage('${l.page}')" data-page="${l.page}"><span class="nav-item-icon">${l.icon}</span>${l.label}</div>`;
        });
      });
      document.getElementById('sidebar-nav').innerHTML = html;

    function showPage(page) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
      const titles = {
        dashboard: 'Dashboard', submissions: 'Submissions', approvals: 'Pending Approvals',
        'dept-reports': 'Department Quality Reports', 'dept-data': 'Departments Data', 'comm-reports': 'Committee Quality Reports',
        calendar: 'Academic Calendar', notifications: 'Notifications & Alerts',
        reports: 'Reports & Export', users: 'User Management', submit: 'Submit Monthly Report',
        sections: 'Manage Form Sections', org: 'Organization Setup', guide: 'User Guide & Documentation', contact: 'Contact IT Support'
      };
      document.getElementById('page-title').textContent = titles[page] || page;
      const c = document.getElementById('page-content');

      switch (page) {
        case 'dashboard': c.innerHTML = buildDashboard(); break;
        case 'submissions': c.innerHTML = buildSubmissions(); break;
        case 'approvals': c.innerHTML = buildApprovals(); break;
        case 'dept-reports': c.innerHTML = buildDeptReports(); break;
        case 'dept-data': c.innerHTML = buildDeptData(); break;
        case 'comm-reports': c.innerHTML = buildCommReports(); break;
        case 'calendar': c.innerHTML = buildCalendar(); break;
        case 'reports': c.innerHTML = buildReports(); break;
        case 'users': c.innerHTML = buildUsers(); break;
        case 'sections': c.innerHTML = buildSectionsMgmt(); break;
        case 'org': c.innerHTML = buildOrgMgmt(); break;
        case 'notifications': c.innerHTML = buildNotifications(); break;
        case 'submit': c.innerHTML = buildSubmitForm(); initRepeatables(); break;
        case 'guide': c.innerHTML = buildGuidePage(); break;
        case 'contact': c.innerHTML = buildContactPage(); break;
        default: c.innerHTML = `<p>Page not found.</p>`;
      }

      if (window.innerWidth <= 900) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (sidebar) sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('open');
      }
    }

    function openAddOrg(type) {
      const title = type === 'departments' ? 'Department' : 'Committee';
      openModal(`Add New ${title}`, `
        <div class="form-group">
            <label class="form-label">${title} Name</label>
            <input type="text" class="form-control" id="new-org-name" placeholder="e.g. IT, Student Council...">
        </div>
      `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitOrg('${type}')">Save ${title}</button>`);
    }

    async function submitOrg(type) {
        const input = document.getElementById('new-org-name');
        const name = input.value.trim();
        if(!name) return showToast("Name is required.");
        
        try {
            const res = await fetch(`${API_URL}/config/${type}`, {
                method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name})
            });
            if(res.ok) {
                await fetchCoreData();
                closeModal();
                showPage('org');
                showToast(`Added successfully.`);
            } else {
                showToast("Error saving to database. May already exist.");
            }
        } catch(e) { showToast("Connection failed."); }
    }

    async function deleteOrg(type, name) {
        if(!confirm(`Are you sure you want to delete "${name}"? This will not delete past submissions, but will remove it from future reporting forms.`)) return;
        
        try {
            const res = await fetch(`${API_URL}/config/${type}/${encodeURIComponent(name)}`, { method: 'DELETE' });
            if(res.ok) {
                await fetchCoreData();
                showPage('org');
                showToast(`Deleted successfully.`);
            }
        } catch(e) { showToast("Connection failed."); }
    }

    async function submitEditDeptData(dept) {
      let newData = { faculty: parseInt(document.getElementById('ed-faculty').value) || 0, placed: 0 };
      if (dept === 'BHS') {
        newData.cse = parseInt(document.getElementById('ed-cse').value) || 0;
        newData.ece = parseInt(document.getElementById('ed-ece').value) || 0;
        newData.eee = parseInt(document.getElementById('ed-eee').value) || 0;
        newData.civil = parseInt(document.getElementById('ed-civil').value) || 0;
      } else {
        newData.y1 = parseInt(document.getElementById('ed-y1').value) || 0;
        newData.y2 = parseInt(document.getElementById('ed-y2').value) || 0;
        newData.y3 = parseInt(document.getElementById('ed-y3').value) || 0;
        newData.y4 = parseInt(document.getElementById('ed-y4').value) || 0;
        const pEl = document.getElementById('ed-placed');
        newData.placed = pEl ? parseInt(pEl.value) || 0 : 0;

      closeModal();
      document.getElementById('dept-data-content').innerHTML = getDeptDataContent(dept);
      showToast(`${dept} data updated successfully.`);

    // ════════════════════════════════════════════
    function canUserViewNotif(n) {
      const isAdmin = (currentUser.role === 'Super Admin' || currentUser.role === 'Admin');
      if (isAdmin) return true;
      const t = n.target || 'All';
      if (t === 'All') return true;
      const userDepts = currentUser.dept ? currentUser.dept.split(',').map(d => d.trim()) : [];
      const actsAsHOD = currentUser.role === 'HOD' || userDepts.some(d => DEPARTMENTS.includes(d));
      const actsAsComm = currentUser.role === 'Committee Head' || userDepts.some(d => COMMITTEES.includes(d));
      if (t === 'HOD' && actsAsHOD) return true;
      if (t === 'Committee' && actsAsComm) return true;
      return false;
    }

    function buildNotifications() {
      let html = `<div class="card">
    <div class="card-header">
      <span class="card-title">Notifications & Alerts</span>
      <div style="display:flex; gap: 0.5rem; flex-wrap:wrap;">
        ${(currentUser.role === 'Super Admin' || currentUser.role === 'Admin') ? `<button class="btn btn-primary btn-sm" onclick="openSendAlert()">+ Send Alert</button>` : ''}
        <button class="btn btn-secondary btn-sm" onclick="markAllRead()">Mark All Read</button>
      </div>
    </div>
    <div class="card-body">`;
      const isAdmin = (currentUser.role === 'Super Admin' || currentUser.role === 'Admin');
      const visibleNotifs = notifications.filter(n => canUserViewNotif(n));

      if (visibleNotifs.length === 0) {
        html += `<p style="font-size:.8rem;color:var(--gray-400);">No notifications.</p>`;
      } else {
        html += visibleNotifs.map(n => `
        <div class="notif-item" style="${n.read ? 'opacity:0.6;' : ''}">
          <div class="notif-dot ${n.type}"></div>
          <div style="flex:1;">
            <div class="notif-text" style="font-weight:${n.read ? '400' : '600'};">${n.text}</div>
            <div class="notif-time">${formatDBDate(n.time)}</div>
            ${isAdmin && n.target && n.target !== 'All' ? `<div style="font-size:0.65rem; color:var(--navy); margin-top:4px; font-weight:600; background:var(--navy-pale); padding:2px 6px; border-radius:4px; display:inline-block;">🎯 Sent to: ${n.target}s Only</div>` : ''}
          </div>
          ${isAdmin ? `<button class="btn btn-danger btn-sm" style="padding:2px 6px; font-size:10px; height:fit-content;" onclick="deleteNotification('${n.id}')">✕</button>` : ''}
        </div>`).join('');
      }
      html += `</div></div>`;
      return html;
    }

    function updateNotifBadge() {
      const unread = notifications.filter(n => !n.read && canUserViewNotif(n)).length;
      const badge = document.getElementById('notif-badge');
      if (badge) { badge.textContent = unread; badge.style.display = unread > 0 ? 'flex' : 'none'; }
    }

    function markAllRead() {
      notifications.forEach(n => { if (canUserViewNotif(n)) { n.read = true; } });
      updateNotifBadge(); showPage('notifications');
    }

    function openSendAlert() {
      openModal('Send Alert to Users', `
        <div class="form-group"><label class="form-label">Target Audience</label>
            <select class="form-control" id="alert-target"><option value="All">All HODs & Committee Heads</option><option value="HOD">All HODs Only</option><option value="Committee">All Committee Heads Only</option></select>
        </div>
        <div class="form-group"><label class="form-label">Message</label><textarea class="form-control" id="alert-msg" rows="3" placeholder="e.g. Friendly reminder..."></textarea></div>
        <div class="form-group"><label class="form-label">Priority Level</label>
            <select class="form-control" id="alert-priority"><option value="info">Normal (Blue Dot)</option><option value="warning">High (Orange Dot)</option><option value="critical">Urgent Deadline (Red Dot)</option></select>
        </div>
    `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAlert()">Send In-App Alert</button>`);
    }

    async function submitAlert() {
      const msg = document.getElementById('alert-msg').value.trim();
      if (!msg) return showToast("Message is required.");
      const payload = { text: msg, time: new Date().toISOString(), type: document.getElementById('alert-priority').value, target: document.getElementById('alert-target').value };
      try {
        const res = await fetch(`${API_URL}/notifications`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (res.ok) { await fetchCoreData(); closeModal(); updateNotifBadge(); showPage('notifications'); showToast("Alert successfully broadcasted."); return; }
      } catch (e) { }
      notifications.unshift({ ...payload, id: Date.now(), read: false });
      closeModal(); updateNotifBadge(); showPage('notifications'); showToast("Alert saved locally.");
    }

    async function deleteNotification(id) {
      if (!confirm("Are you sure you want to delete this notification?")) return;
      try { await fetch(`${API_URL}/notifications/${encodeURIComponent(id)}`, { method: 'DELETE' }); } catch (e) {}
      notifications = notifications.filter(n => String(n.id) !== String(id));
      showPage('notifications'); updateNotifBadge(); showToast("Notification deleted.");
    }

    // ════════════════════════════════════════════
    // SECTION PROGRESS WIDGET
    // ════════════════════════════════════════════
    function buildSectionProgressHTML(filteredSubs) {
      if (filteredSubs.length === 0) return '<p style="font-size:.8rem;color:var(--gray-400);">No submissions available to calculate progress.</p>';
      const allPossibleSecs = getAllPossibleSectionsMap();
      const presentKeys = new Set();
      filteredSubs.forEach(sub => {
        let data = sub.report_data || sub.reportData;
        if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = null; } }
        if (data) { Object.keys(data).forEach(k => presentKeys.add(k.replace('Section ', ''))); }
      });

      if (presentKeys.size === 0) Object.keys(SECTIONS).forEach(k => presentKeys.add(k));

      let html = '';
      Array.from(presentKeys).sort((a, b) => a - b).forEach(sec => {
        let filledCount = 0;
        filteredSubs.forEach(sub => {
          let data = sub.report_data || sub.reportData;
          if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = null; } }
          if (data && data[`Section ${sec}`]) { filledCount++; }
        });
        let pct = Math.round((filledCount / filteredSubs.length) * 100);
        let colorClass = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--orange)' : 'var(--red)';
        let title = allPossibleSecs[sec] || `Section ${sec}`;
        html += `
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.8rem;">
            <div style="width:45%;max-width:260px;font-size:.8rem;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="S.${sec}: ${title}">S.${sec}: ${title}</div>
            <div style="flex:1;height:8px;background:var(--gray-100);border-radius:4px;overflow:hidden;">
                <div style="height:100%;width:${pct}%;background:${colorClass};border-radius:4px;transition:width 0.5s;"></div>
            </div>
            <div style="width:35px;text-align:right;font-size:.75rem;font-family:'DM Mono',monospace;color:var(--gray-500);">${pct}%</div>
        </div>`;
      });
      return html;
    }

    // ════════════════════════════════════════════
    function statusClass(pct) { return pct >= 70 ? 'good' : pct >= 60 ? 'risk' : 'critical'; }

    function buildDashboard() {
      const role = currentUser.role;
      if (role === 'Super Admin' || role === 'Admin') return buildAdminDashboard();
      if (role === 'Principal') return buildPrincipalDashboard();
      return buildHODDashboard();
    }

      const deptData = DEPARTMENTS.map(d => {
        const deptSubs = submissions.filter(s => s.dept === d);
        const avg = deptSubs.length ? Math.round(deptSubs.reduce((a, b) => a + (b.complete_pct || b.completePct), 0) / deptSubs.length) : 0;
        return { dept: d, pct: avg };
      });
      const commData = COMMITTEES.map(c => {
        const commSubs = submissions.filter(s => s.dept === c);
        const avg = commSubs.length ? Math.round(commSubs.reduce((a, b) => a + (b.complete_pct || b.completePct), 0) / commSubs.length) : 0;
        return { dept: c, pct: avg };
      });
      const overall = deptData.length ? Math.round(deptData.reduce((a, d) => a + d.pct, 0) / deptData.length) : 0;
      
      let heatmapHTML = deptData.map(d => `
        <div class="heatmap-cell ${statusClass(d.pct)}"><div class="dept-name">${d.dept}</div><div class="dept-pct">${d.pct}%</div></div>`).join('');

      let commHTML = commData.map(c => `

          <div style="display:flex;align-items:center;gap:.5rem;"><div class="prog-wrap" style="width:50px;height:6px;"><div class="prog-fill ${statusClass(c.pct)}" style="width:${c.pct}%"></div></div><span style="font-size:.7rem;font-family:'DM Mono',monospace;width:25px;text-align:right;">${c.pct}%</span></div>
        </div>`).join('');

      const pendingCount = submissions.filter(s => s.status === 'Pending').length;
      const approvedCount = submissions.filter(s => s.status === 'Approved').length;

      return `
  <div class="kpi-grid">
    <div class="kpi-card blue"><div class="kpi-label">Overall Dept Completion</div><div class="kpi-value">${overall}%</div></div>
    <div class="kpi-card gold"><div class="kpi-label">Pending Approvals</div><div class="kpi-value">${pendingCount}</div></div>
    <div class="kpi-card green"><div class="kpi-label">Approved Reports</div><div class="kpi-value">${approvedCount}</div></div>
    <div class="kpi-card red"><div class="kpi-label">Total Users</div><div class="kpi-value">${USERS.length}</div></div>
  </div>
  <div class="grid-2">
    <div class="card"><div class="card-header"><span class="card-title">Department Heatmap</span></div><div class="card-body"><div class="heatmap-grid">${heatmapHTML}</div></div></div>
    <div class="card"><div class="card-header"><span class="card-title">Pending Queue</span><button class="btn btn-primary btn-sm" onclick="showPage('approvals')">View All</button></div>
      <div class="card-body">
        ${submissions.filter(s => s.status === 'Pending').slice(0, 3).map(s => `
          <div style="display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--gray-100);">
            <div><div style="font-size:.83rem;font-weight:600;">${s.dept} — ${s.month} ${s.year}</div></div>
            <button class="btn btn-success btn-sm" onclick="approveSubmission('${s.id}')">✓</button>
          </div>`).join('')}
      </div>
    </div>
  </div>
  <div class="grid-2" style="margin-top:1rem;">
    <div class="card"><div class="card-header"><span class="card-title">Committee Performance</span></div><div class="card-body" style="max-height: 350px; overflow-y: auto; padding-right: 1rem;">${commHTML}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">Section-wise Reporting Progress</span></div><div class="card-body" style="max-height: 350px; overflow-y: auto; padding-right: 1.5rem;">${buildSectionProgressHTML(submissions.filter(s => DEPARTMENTS.includes(s.dept)))}</div></div>
  </div>`;
    }

    function buildPrincipalDashboard() {
      const deptData = DEPARTMENTS.map(d => {
        const deptSubs = submissions.filter(s => s.dept === d);
        const avg = deptSubs.length ? Math.round(deptSubs.reduce((a, b) => a + (b.complete_pct || b.completePct), 0) / deptSubs.length) : 0;

        const pct = s.complete_pct || s.completePct;

      showToast("Generating Full Report for " + s.dept + "...");
      setTimeout(() => {

          const { jsPDF } = window.jspdf; const doc = new jsPDF();
          doc.setFontSize(16); doc.text("Dr. Lankapalli Bullayya College of Engineering", 105, 20, { align: "center" });
          doc.setFontSize(12); doc.text("IQAC Monthly Department Report", 105, 28, { align: "center" });
          doc.setFontSize(10); doc.text(`Department: ${s.dept}\nPeriod: ${s.month} ${s.year}\nStatus: ${s.status}`, 14, 40);
          
          let data = s.report_data || s.reportData || {};
          if (typeof data === 'string') { try { data = JSON.parse(data); } catch(e){ data = {};} }
          const body = Object.keys(data).map(k => [k, data[k]]);
          
          doc.autoTable({ startY: 65, head: [["Section", "Data"]], body: body, theme: 'grid' });
          doc.save(`Report_${s.dept}_${s.month}_${s.year}.pdf`);

      const newDescEl = document.getElementById('edit-sec-desc');
      const payload = { title: newTitle, description: newDescEl ? newDescEl.value : '' };
      
      if (!newTitle) return showToast("Title is required.");
      
      if(type === 'committee') {
          try {
            await fetch(`${API_URL}/config/comm_sections/${num}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

    function secCard(num, title, sub, content) {
      return `<div class="sec-card">
    <div class="sec-title"><div class="sec-num" style="background:${num > 100 ? 'var(--gold)' : 'var(--navy)'}">${num > 100 ? '' : num}</div><div class="sec-title-text">${title}</div></div>
    ${sub ? `<div class="sec-sub" style="margin-left:${num > 100 ? '0' : '30px'};">${sub}</div>` : ''}
    ${content}
  </div>`;
    }

    let formPage = 0;
    function initRepeatables() {
      document.addEventListener('input', updateFormProgress);
      document.addEventListener('change', updateFormProgress);
      formPage = 0;
    }

    function updateFormProgress() {
      const filled = new Set();
      document.querySelectorAll('[data-sec]').forEach(el => {
        const v = el.value || el.checked;
        if (v && String(v).trim()) filled.add(el.getAttribute('data-sec'));
      });
      const currentSecMap = getCurrentSectionsMap();
      const totalSecs = Object.keys(currentSecMap).length;
      const c = filled.size;
      const pct = totalSecs > 0 ? Math.round((c / totalSecs) * 100) : 0;
      const fill = document.getElementById('form-prog-fill');
      const label = document.getElementById('form-prog-label');
      if (fill) fill.style.width = pct + '%';
      if (label) label.textContent = `${c} of ${totalSecs} sections filled (${pct}%)`;
    }

    function showFormPage(n) {
      const pages = document.querySelectorAll('.f-page');
      const tabs = document.querySelectorAll('#form-tabs .tab-btn');
      if (n < 0 || n >= pages.length) return;
      pages.forEach((el, i) => { el.style.display = (i === n) ? 'block' : 'none'; });
      tabs.forEach((b, i) => b.classList.toggle('active', i === n));
      formPage = n;
      const prev = document.getElementById('form-prev'), next = document.getElementById('form-next');
      if (prev) prev.disabled = (n === 0);
      if (next) next.disabled = (n === pages.length - 1);
    }

    function changeFormPage(dir) { showFormPage(Math.max(0, Math.min(document.querySelectorAll('.f-page').length - 1, formPage + dir))); }

    function buildFormReview() {
      const filled = {};
      document.querySelectorAll('[data-sec]').forEach(el => {
        if ((el.value || el.checked) && String(el.value).trim()) filled[el.getAttribute('data-sec')] = true;
      });
      let html = `<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:.4rem;">`;
      const currentSecMap = getCurrentSectionsMap();
      Object.keys(currentSecMap).forEach(s => {
        const done = filled[s];
        const prefix = parseInt(s) > 100 ? '' : `S.${s}: `;
        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:.4rem .6rem;background:${done ? 'var(--green-bg)' : 'var(--gray-50)'};border-radius:4px;">
      <span style="font-size:.73rem;color:${done ? 'var(--green)' : 'var(--gray-400)'};">${prefix}${currentSecMap[s]}</span>
      <span style="font-size:.7rem;font-weight:600;color:${done ? 'var(--green)' : 'var(--gray-300)'};">${done ? '✓' : '—'}</span></div>`;
      });
      html += '</div>';
      document.getElementById('review-summary').innerHTML = html;
    }

    async function submitFormReport(isDraft = false) {
      const dept = document.getElementById('rep-dept').value || 'Institution';
      const month = document.getElementById('rep-month').value;
      const year = document.getElementById('rep-year').value;
      
      const filled = new Set();
      const reportData = {};
      document.querySelectorAll('[data-sec]').forEach(el => {
        const v = el.value;
        if (v && String(v).trim()) {
          const secID = el.getAttribute('data-sec');
          filled.add(secID);
          if (!reportData[`Section ${secID}`]) reportData[`Section ${secID}`] = [];
          reportData[`Section ${secID}`].push(v);
        }
      });
      Object.keys(reportData).forEach(k => { reportData[k] = reportData[k].join('\n'); });

      const currentSecMap = getCurrentSectionsMap();
      const totalSecs = Object.keys(currentSecMap).length;
      const newId = 'SUB-' + Math.random().toString(36).substr(2, 6).toUpperCase();
      
      const payload = {
        id: newId, dept, month, year, status: isDraft ? 'Draft' : 'Pending', sections: filled.size,
        completePct: totalSecs > 0 ? Math.round((filled.size / totalSecs) * 100) : 0, reportData: reportData
      };

      try {
        const res = await fetch(`${API_URL}/submissions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (res.ok) {
          await fetchCoreData();
          showToast(isDraft ? `✓ Draft saved securely.` : `✓ Report submitted for review.`);
          if (!isDraft) showPage('submissions');
        }
      } catch (e) { showToast("Submission failed"); }
    }

    function openModal(title, body, footer = '') {
      document.getElementById('modal-title').textContent = title; document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal-footer').innerHTML = footer || '<button class="btn btn-secondary" onclick="closeModal()">Close</button>';
      document.getElementById('modal-overlay').classList.add('open');
    }
    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  </script>
</body>
</html>
